<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>End-Fed Wire Antenna Length Calculator</title>
  <meta name="description" content="Pick end-fed random wire lengths that avoid half-wave resonances on the US ham bands you care about.">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { margin: 0; }

    /* Layout */
    .app {
      position: relative;
      min-height: 100vh;
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: "JetBrains Mono", "SF Mono", Monaco, Consolas, monospace;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /*
     * Diagonal corner ribbon, top right.  The wrapper is a fixed square
     * pinned to the corner with overflow hidden; the band inside is rotated
     * 45 degrees and made wide enough that its ends are clipped away, which
     * is what gives the mitred look without drawing the triangle.
     */
    /* Preset buttons sitting under a slider, e.g. the return-path lengths. */
    .preset-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .ribbon {
      position: absolute;
      top: 0;
      right: 0;
      width: 104px;
      height: 104px;
      overflow: hidden;
      pointer-events: none;
      z-index: 10;
    }

    .ribbon span {
      position: absolute;
      display: block;
      width: 150px;
      padding: 3px 0;
      top: 26px;
      right: -38px;
      transform: rotate(45deg);
      /*
       * Translucent so the title reads through it.  The ribbon overlays the
       * viewport corner and the title is nearly viewport-wide, so they
       * collide at any size worth reading; letting it wash over is cheaper
       * than reserving a band of empty page for it.
       */
      background: rgba(139, 26, 26, 0.55);
      color: rgba(255, 232, 232, 0.85);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
    }

    .title {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: #fff;
      margin: 0;
      text-transform: uppercase;
      text-align: center;
    }

    .main-content {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 1100px;
    }

    .column {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1 1 320px;
      min-width: 300px;
    }

    .column-wide {
      flex: 2 1 560px;
    }

    /* Panels */
    .panel {
      background: #1a1a1a;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #333;
    }

    .panel-header {
      font-size: 11px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }

    /* Buttons */
    .btn {
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn:focus-visible {
      outline: 2px solid #4dabf7;
      outline-offset: 2px;
    }

    .presets {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    /* The NEC check's one row: a button, then whatever it has to say. */
    .nec-check {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin: 2px 0 10px;
    }
    .nec-check .control-hint { margin-top: 0; }

    .preset-btn {
      padding: 6px 12px;
      background: #111;
      color: #888;
      border: 1px solid #333;
      font-size: 11px;
      font-weight: 400;
    }

    .preset-btn:hover { color: #fff; border-color: #555; }

    .preset-btn.active { background: #333; color: #fff; border-color: #555; }

    /* Band selector */
    .band-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
      gap: 6px;
    }

    .band-btn {
      padding: 8px 6px;
      background: #111;
      border: 1px solid #333;
      color: #808080;
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
    }

    .band-btn.active {
      background: #12403a;
      border-color: #009e73;
      color: #4fd1ab;
    }

    .band-btn .band-freq {
      display: block;
      font-size: 9px;
      color: #949494;
      font-weight: 400;
    }

    /* 5.07:1 on #12403a, dimmer than the label's #4fd1ab at 6.07:1. */
    .band-btn.active .band-freq { color: #32c19b; }

    /* Segment toggle */
    .segment-toggle {
      display: flex;
      gap: 6px;
      background: #111;
      padding: 4px;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .segment-btn {
      flex: 1;
      padding: 6px 10px;
      background: transparent;
      color: #808080;
      font-size: 11px;
    }

    .segment-btn.active { background: #333; color: #fff; }

    /* Controls */
    .control-label {
      display: block;
      margin-bottom: 14px;
      font-size: 12px;
      color: #888;
    }

    .control-label:last-child { margin-bottom: 0; }

    /*
     * A group of buttons where one is chosen.  fieldset rather than label:
     * a label with no `for` binds to its first labelable descendant, so
     * clicking the word "Ground" was activating the first soil button.
     */
    .control-group {
      display: block;
      margin: 0 0 14px;
      padding: 0;
      border: 0;
    }

    .control-group:last-child { margin-bottom: 0; }

    /*
     * A legend is a block, where the label it replaced put its text inline
     * with the buttons, so without this the caption sits flush on the row
     * beneath it.
     */
    .control-group > legend {
      padding: 0;
      margin-bottom: 6px;
      font-size: 12px;
      color: #888;
    }

    .control-value { color: #fff; }

    .control-slider { width: 100%; margin-top: 4px; }

    /* Links inside a hint: only .info and .footer styled them, so one here
       fell back to the browser's default blue on a dark panel. */
    .control-hint a { color: #7fb2e5; }

    /* Said when the exported deck will disagree with the page, which is a
       different kind of statement from the hints around it. */
    .deck-warning {
      color: #e0a862;
      border-left: 2px solid #8a5a12;
      padding-left: 8px;
      margin-bottom: 6px;
    }

    .control-hint {
      font-size: 10px;
      color: #949494;
      margin-top: 4px;
      line-height: 1.5;
    }

    .control-hint.right { text-align: right; margin-top: 8px; }

    .num-input {
      width: 80px;
      padding: 4px 6px;
      background: #111;
      border: 1px solid #333;
      border-radius: 4px;
      color: #e0e0e0;
      font-family: inherit;
      font-size: 12px;
    }

    .num-input:focus { border-color: #555; }
    .num-input:focus-visible {
      outline: 2px solid #4dabf7;
      outline-offset: 2px;
    }

    .len-input {
      width: 100px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      padding: 2px 6px;
    }

    /* Length map */
    .map-container {
      background: #111;
      border-radius: 8px;
      padding: 12px;
      border: 1px solid #333;
    }

    .map-svg { display: block; width: 100%; }

    .map-readout {
      font-size: 11px;
      color: #888;
      margin-top: 6px;
      min-height: 16px;
    }

    .map-legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 10px;
      color: #949494;
      margin-top: 8px;
    }

    .swatch {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      margin-right: 5px;
      vertical-align: -1px;
    }

    .swatch-hatch {
      background: repeating-linear-gradient(45deg, #8c8c88 0 2px, #2a2a28 2px 5px);
    }

    /* Verdict */
    /* The geometry picker: two pictures, side by side, chosen like radios. */
    .geometry-row { display: flex; gap: 8px; }
    .geometry-btn {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 6px 4px 5px;
      background: #111;
      border: 1px solid #333;
      border-radius: 4px;
      color: #888;
      cursor: pointer;
      font: inherit;
    }
    .geometry-btn:hover { border-color: #555; }
    .geometry-btn.active { background: #12403a; border-color: #009e73; color: #4fd1ab; }
    .geometry-figure { width: 100%; height: auto; display: block; }
    .geometry-name { font-size: 11px; letter-spacing: 0.03em; }

    .verdict {
      padding: 12px 14px;
      border-radius: 8px;
      border: 2px solid #333;
      background: #1a1a1a;
    }

    .verdict.good { background: #0d2621; border-color: #009e73; }
    .verdict.bad { background: #2b1409; border-color: #d55e00; }

    .verdict-headline {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }

    .verdict-detail { font-size: 11px; color: #aaa; line-height: 1.6; }
    .verdict-domain { margin-top: 6px; color: #e0b050; }

    /* Verdict column of the published-lengths table. */
    .score-ok { color: #009e73; }
    .score-poor { color: #d55e00; }

    /* Tables */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th {
      text-align: right;
      font-size: 10px;
      font-weight: 600;
      color: #949494;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 4px 6px;
      border-bottom: 1px solid #333;
    }

    th:first-child, td:first-child { text-align: left; }

    td {
      text-align: right;
      padding: 4px 6px;
      color: #aaa;
      border-bottom: 1px solid #222;
    }

    tr.pick:hover td { background: #222; color: #fff; }

    /*
     * The length itself is the control.  A row with an onClick handler is
     * unreachable by keyboard, and this is the primary way to accept a
     * recommendation, so it has to be a real button rather than a row that
     * happens to respond to a mouse.
     */
    .pick-btn {
      padding: 0;
      border: 0;
      background: none;
      font: inherit;
      color: inherit;
      cursor: pointer;
      text-align: left;
    }

    .pick-btn:hover { text-decoration: underline; }

    .best-length { color: #4fd1ab; font-weight: 600; }

    .empty-note { font-size: 11px; color: #949494; }

    .link-btn {
      background: transparent;
      color: #4fd1ab;
      font-size: 11px;
      font-weight: 600;
      padding: 0;
      text-decoration: underline;
    }

    /* Info and footer */
    .info {
      max-width: 780px;
      font-size: 12px;
      color: #949494;
      line-height: 1.7;
    }

    .info strong { color: #aaa; }
    .info a { color: #888; }

    .footer {
      font-size: 11px;
      color: #949494;
      text-align: center;
    }

    .footer a { color: #888; }

    @media (max-width: 800px) {
      .app { padding: 16px; gap: 16px; }
      .column, .column-wide { min-width: unset; width: 100%; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef, useCallback } = React;

    // BEGIN PURE
    // Everything to END PURE is free of React, window and document, so
    // tools/extract-model.mjs can pull it out and run it under node for the
    // tests.  Keep it that way: a DOM reference in here breaks `npm test`.

    // ============================================================
    // Constants
    // ============================================================

    /** Speed of light, m/s. */
    const C_SPEED = 299792458;

    /** Feet per meter (exact, by definition of the international foot). */
    const FT_PER_M = 1 / 0.3048;

    /**
     * Amateur band edges in kHz, per region.
     *   m:     band wavelength in meters, the key used everywhere else
     *   full:  whole band
     *   cw:    CW / narrowband segment
     * National rules vary inside each IARU region; the region entries follow
     * the IARU band plans, and the US entry follows FCC allocations.
     * The shape is left to inference so that the region keys stay a literal
     * union; an Object<string, ...> annotation would widen them to string and
     * let a bad ?region= through the lookup.
     */
    const REGIONS = Object.freeze({
      us: {
        label: 'United States',
        note: '47 CFR 97.301, per the ARRL frequency chart. Includes the 60m '
          + 'rules effective 13 Feb 2026.',
        bands: [
          // 2200m and 630m were allocated in 2017; both are secondary and
          // power limited, but the half-wave lengths still apply.
          { m: 160,  label: '160m',  full: [1.8e6, 2e6],         cw: [1.8e6, 1.84e6] },
          { m: 80,   label: '80m',   full: [3.5e6, 4e6],         cw: [3.5e6, 3.6e6] },
          // Since 13 Feb 2026: the 5351.5-5366.5 kHz band at 9.15 W ERP, plus
          // four retained 2.8 kHz channels centered on 5332, 5348, 5373 and
          // 5405 kHz at 100 W ERP.  The span below covers all of it.
          // US 60 m is one 15 kHz band plus four discrete channels.  Only the
          // band is modeled: sampling across the whole 5.3306-5.4064 MHz
          // envelope would put most samples on spectrum nobody may transmit
          // on, and would widen the classical keep-out zones to match.
          { m: 60,   label: '60m',   full: [5.3515e6, 5.3665e6], cw: [5.3515e6, 5.3665e6] },
          { m: 40,   label: '40m',   full: [7e6, 7.3e6],         cw: [7e6, 7.125e6] },
          { m: 30,   label: '30m',   full: [10.1e6, 10.15e6],    cw: [10.1e6, 10.15e6] },
          { m: 20,   label: '20m',   full: [14e6, 14.35e6],      cw: [14e6, 14.15e6] },
          { m: 17,   label: '17m',   full: [18.068e6, 18.168e6], cw: [18.068e6, 18.11e6] },
          { m: 15,   label: '15m',   full: [21e6, 21.45e6],      cw: [21e6, 21.2e6] },
          { m: 12,   label: '12m',   full: [24.89e6, 24.99e6],   cw: [24.89e6, 24.93e6] },
          { m: 10,   label: '10m',   full: [28e6, 29.7e6],       cw: [28e6, 28.3e6] },
        ],
      },
      r1: {
        label: 'IARU Region 1',
        note: 'Europe, Africa, Middle East, northern Asia. 6m upper edge varies by country.',
        bands: [
          { m: 160,  label: '160m',  full: [1.81e6, 2e6],        cw: [1.81e6, 1.838e6] },
          { m: 80,   label: '80m',   full: [3.5e6, 3.8e6],       cw: [3.5e6, 3.57e6] },
          { m: 60,   label: '60m',   full: [5.3515e6, 5.3665e6], cw: [5.3515e6, 5.354e6] },
          { m: 40,   label: '40m',   full: [7e6, 7.2e6],         cw: [7e6, 7.04e6] },
          { m: 30,   label: '30m',   full: [10.1e6, 10.15e6],    cw: [10.1e6, 10.13e6] },
          { m: 20,   label: '20m',   full: [14e6, 14.35e6],      cw: [14e6, 14.07e6] },
          { m: 17,   label: '17m',   full: [18.068e6, 18.168e6], cw: [18.068e6, 18.095e6] },
          { m: 15,   label: '15m',   full: [21e6, 21.45e6],      cw: [21e6, 21.07e6] },
          { m: 12,   label: '12m',   full: [24.89e6, 24.99e6],   cw: [24.89e6, 24.915e6] },
          { m: 10,   label: '10m',   full: [28e6, 29.7e6],       cw: [28e6, 28.07e6] },
        ],
      },
      r2: {
        label: 'IARU Region 2',
        note: 'The Americas. National allocations differ; the US entry is more specific.',
        bands: [
          { m: 160,  label: '160m',  full: [1.8e6, 2e6],         cw: [1.8e6, 1.84e6] },
          { m: 80,   label: '80m',   full: [3.5e6, 4e6],         cw: [3.5e6, 3.58e6] },
          { m: 60,   label: '60m',   full: [5.3515e6, 5.3665e6], cw: [5.3515e6, 5.354e6] },
          { m: 40,   label: '40m',   full: [7e6, 7.3e6],         cw: [7e6, 7.05e6] },
          { m: 30,   label: '30m',   full: [10.1e6, 10.15e6],    cw: [10.1e6, 10.13e6] },
          { m: 20,   label: '20m',   full: [14e6, 14.35e6],      cw: [14e6, 14.07e6] },
          { m: 17,   label: '17m',   full: [18.068e6, 18.168e6], cw: [18.068e6, 18.095e6] },
          { m: 15,   label: '15m',   full: [21e6, 21.45e6],      cw: [21e6, 21.07e6] },
          { m: 12,   label: '12m',   full: [24.89e6, 24.99e6],   cw: [24.89e6, 24.915e6] },
          { m: 10,   label: '10m',   full: [28e6, 29.7e6],       cw: [28e6, 28.07e6] },
        ],
      },
      r3: {
        label: 'IARU Region 3',
        note: 'Asia-Pacific. 80m and 40m upper edges vary widely by country; '
          + 'Australia and New Zealand reach 7.3 MHz where the plan stops at 7.2.',
        bands: [
          { m: 160,  label: '160m',  full: [1.8e6, 2e6],         cw: [1.8e6, 1.84e6] },
          { m: 80,   label: '80m',   full: [3.5e6, 3.9e6],       cw: [3.5e6, 3.54e6] },
          { m: 60,   label: '60m',   full: [5.3515e6, 5.3665e6], cw: [5.3515e6, 5.354e6] },
          // 7.1-7.2 is amateur in Regions 1 and 3; 7.2-7.3 is Region 2 only,
          // and broadcasting here.
          { m: 40,   label: '40m',   full: [7e6, 7.2e6],         cw: [7e6, 7.04e6] },
          { m: 30,   label: '30m',   full: [10.1e6, 10.15e6],    cw: [10.1e6, 10.13e6] },
          { m: 20,   label: '20m',   full: [14e6, 14.35e6],      cw: [14e6, 14.07e6] },
          { m: 17,   label: '17m',   full: [18.068e6, 18.168e6], cw: [18.068e6, 18.095e6] },
          { m: 15,   label: '15m',   full: [21e6, 21.45e6],      cw: [21e6, 21.07e6] },
          { m: 12,   label: '12m',   full: [24.89e6, 24.99e6],   cw: [24.89e6, 24.915e6] },
          { m: 10,   label: '10m',   full: [28e6, 29.7e6],       cw: [28e6, 28.07e6] },
        ],
      },
    });

    /**
     * Units carried by the numbers below.  These are aliases, not distinct
     * types, so they document intent without forcing a cast at every step of
     * a calculation; the checker still catches a length passed where a
     * frequency belongs only where the alias appears in a signature.
     *
     * @typedef {number} Meters
     * @typedef {number} Hertz
     */

    /**
     * @typedef {Object} Band
     * @property {number} m      band wavelength in meters, the key used elsewhere
     * @property {string} label
     * @property {Hertz[]} full  whole-band edges, low first
     * @property {Hertz[]} cw    CW / narrowband segment edges
     *
     * @typedef {keyof typeof REGIONS} RegionKey
     * @typedef {keyof typeof SEGMENTS} SegmentKey
     * @typedef {keyof typeof MODES} ModeKey
     * @typedef {keyof typeof UNITS} UnitKey
     *
     * A length interval to keep away from, and why.
     * @typedef {Object} Interval
     * @property {Meters} lo
     * @property {Meters} hi
     * @property {string} [label]
     * @property {string} [kind]
     *
     * A clear span, with the length to recommend inside it.
     * @typedef {Object} Span
     * @property {Meters} lo
     * @property {Meters} hi
     * @property {Meters} pick
     * @property {Meters} clearance
     */

    /**
     * Bands available in a region.
     * @param {RegionKey} region
     * @returns {Band[]}
     */
    const bandsIn = (region) => REGIONS[region].bands;

    /** Band-selection presets, by band wavelength in meters. */
    const PRESETS = Object.freeze([
      { label: 'HF all',   bands: [160, 80, 60, 40, 30, 20, 17, 15, 12, 10] },
      { label: 'Classic',  bands: [80, 40, 20, 15, 10] },
      { label: 'WARC',     bands: [30, 17, 12] },
      { label: '40-10',    bands: [40, 30, 20, 17, 15, 12, 10] },
      { label: 'Clear',    bands: [] },
    ]);

    /** Wire-end-effect / velocity factor of a thin wire in free space. */
    const DEFAULT_VELOCITY_FACTOR = 0.95;

    /** Default clearance to keep from a half-wave resonance, percent of length. */
    const DEFAULT_MARGIN_PCT = 5;

    /** Range the velocity factor is held to; outside it the math degenerates. */
    const VELOCITY_FACTOR_RANGE = Object.freeze({ min: 0.5, max: 1 });

    /** Range the clearance margin is held to, percent of a half wavelength. */
    const MARGIN_PCT_RANGE = Object.freeze({ min: 0, max: 15 });

    /** Number of best-length suggestions listed. */
    const MAX_SUGGESTIONS = 8;

    /**
     * Lengths the published random-wire tables offer, feet.  Scored and shown

     *   format:    renders a length in meters as text
     * Feet and inches shares its scale with feet, differing only in format,
     * so the input and the map stay decimal while readouts carry inches.
     */
    const UNITS = Object.freeze({
      ft: { label: 'feet', abbrev: 'ft', axisLabel: 'feet', perMeter: FT_PER_M,
            roundStep: 1, format: decimalLength('ft', FT_PER_M) },
      ftin: { label: 'ft + in', abbrev: 'ft', axisLabel: 'feet', perMeter: FT_PER_M,
              roundStep: 1, format: feetAndInches },
      m: { label: 'meters', abbrev: 'm', axisLabel: 'meters', perMeter: 1,
           roundStep: 0.5, format: decimalLength('m', 1) },
    });

    const SEGMENTS = Object.freeze({
      full: { label: 'Whole band', key: /** @type {'full'} */ ('full') },
      cw:   { label: 'CW only', key: /** @type {'cw'} */ ('cw') },
    });

    /**
     * How a length is judged.  The classical method is the published rule and
     * stays the default; the impedance method scores the same lengths against
     * a model of the feedpoint rather than excluding them outright.
     */
    const MODES = Object.freeze({
      classical: {
        label: 'Classic half-wave rule',
        note: 'Excludes lengths near a half-wave multiple, after AB3AP.',
      },
      impedance: {
        label: 'Modeled',
        note: 'Scores lengths by modeled SWR at the radio through the unun.  '
          + 'Indicative only: height, ground and counterpoise move the real '
          + 'figures.',
      },
    });

    const URL_KEYS = Object.freeze({
      region: 'region', bands: 'bands', segment: 'seg', velocityFactor: 'vf',
      marginPct: 'margin', units: 'u', wireLenM: 'len_m', mode: 'mode',
      ununRatio: 'unun', heightM: 'h_m', soil: 'soil', tuner: 'tuner',
      geometry: 'geom', balunM: 'balun_m', counterpoiseM: 'cp_m',
      counterpoiseZM: 'cpz_m',
    });

    /**
     * The counterpoise used to be written as the whole return conductor,
     * drop included, under ?ret_m=.  It is now the run and its height,
     * separately, because those are what someone lays out.  The old key is
     * still read: a link written before the split meant a counterpoise on
     * the ground, so the run is what is left after the drop.
     */
    const LEGACY_RETURN_KEY = 'ret_m';

    /**
     * How the wire is hung.  The two arrangements differ in where the feed
     * is and what shape the wire takes, and they are fitted separately: a
     * flat top is fed at the far end up in the air with the coax dropping
     * from it, while a sloper is fed at a balun near the ground and climbs
     * to whatever support is available.
     *
     * What the return line needs to know about the difference is only which
     * height it drops from; see `feedHeightM`.
     */
    const GEOMETRIES = Object.freeze({
      flatTop: { label: 'Flat top' },
      sloper: { label: 'Sloper' },
    });
    /** @typedef {keyof typeof GEOMETRIES} GeometryKey */

    /** Opens on the arrangement the published tables assume. */
    const DEFAULT_GEOMETRY = 'flatTop';

    /**
     * Which way the return run leaves the feedpoint, by geometry.  A flat
     * top's counterpoise is laid out along the antenna; a sloper's coax heads
     * away, back to the station.  These are the bearings the coefficients were
     * fitted at -- nec/nec_model.py, RETURN_DIRECTION and sloper_deck -- so a
     * deck built the other way is not the antenna the page just scored.
     * nec/geometry_check.py prices the choice at 1.20x on 80 m.
     */
    const RETURN_DIRECTION = Object.freeze({ flatTop: 1, sloper: -1 });

    /**
     * How much longer than its rise a sloper's wire has to be before the
     * model will answer for it, matching nec/nec_model.py's sloper_deck.
     * Within this the wire is all but vertical, and the sweep fitted nothing
     * there.
     */
    const SLOPER_REACH_MARGIN = 1.02;

    /**
     * The installation the impedance model is asked about: how the wire is
     * hung, how high, how much counterpoise there is and how high that sits.
     *
     * `heightM` is the height of the wire on a flat top and of the free end
     * on a sloper, which is the height each geometry is tabulated against.
     * The return conductor is the drop from the feed down to the counterpoise
     * plus the counterpoise itself, and the model wants that whole length.
     *
     * @typedef {Object} Site
     * @property {GeometryKey} geometry
     * @property {Meters} heightM  wire height, or a sloper's free end
     * @property {Meters} balunM  where a sloper is fed; unused on a flat top
     * @property {Meters} counterpoiseM  the run on the ground, beyond the drop
     * @property {Meters} counterpoiseZM  how high that run sits
     * @property {SoilKey} soil
     */

    /**
     * The whole return conductor: the drop from the feedpoint down to the
     * counterpoise, plus the counterpoise itself.
     *
     * @param {Site} site
     * @returns {Meters}
     */
    const returnConductorM = (site) =>
      Math.max(feedHeightM(site) - site.counterpoiseZM, 0) + site.counterpoiseM;

    /**
     * Where the feedpoint is: up at the wire on a flat top, down at the
     * balun on a sloper.  It is what the drop hangs from.
     *
     * @param {Site} site
     * @returns {Meters}
     */
    const feedHeightM = (site) =>
      site.geometry === 'sloper' ? site.balunM : site.heightM;

    /**
     * How high the counterpoise may be raised: it hangs below the feedpoint,
     * and the flat-top fit reaches half the wire height.  A counterpoise above
     * this is a geometry the coefficients were never fitted over, so the state
     * is held at or below it rather than the slider merely drawing it there.
     *
     * @param {{geometry: GeometryKey, heightM: Meters, balunM: Meters}} site
     * @returns {Meters}
     */
    const counterpoiseCeilingM = (site) => Math.min(
      site.geometry === 'sloper' ? site.balunM : site.heightM / 2,
      COUNTERPOISE_Z_RANGE_M.max);

    /**
     * Hold a site to the geometry the model can describe: the counterpoise no
     * higher than the feedpoint it hangs from, and the whole return conductor
     * no shorter than MIN_RETURN_M.  Applied wherever state is made rather
     * than wherever it is drawn, so the display, the URL, the score and the
     * deck cannot come to describe different antennas.
     *
     * @template {Site} T
     * @param {T} site
     * @returns {T}
     */
    const withSiteInvariants = (site) => {
      const counterpoiseZM = Math.min(site.counterpoiseZM,
                                      counterpoiseCeilingM(site));
      const held = { ...site, counterpoiseZM };
      const dropM = Math.max(feedHeightM(held) - counterpoiseZM, 0);
      return {
        ...held,
        counterpoiseM: Math.max(held.counterpoiseM, MIN_RETURN_M - dropM),
      };
    };

    /**
     * A sloper's wire has to be longer than the rise from its balun to its
     * support, or it does not reach.  Null when the geometry is buildable.
     *
     * The margin is the sweep's: nec/nec_model.py refuses a sloper within it
     * of vertical, so a wire in that wedge has no fitted evidence behind it
     * as well as nowhere to go.
     *
     * @param {Site} site
     * @param {Meters} lenM
     * @returns {?Meters} the shortest wire the model will answer for
     */
    const riseShortfallM = (site, lenM) => {
      if (site.geometry !== 'sloper') return null;
      const shortestM = (site.heightM - site.balunM) * SLOPER_REACH_MARGIN;
      return lenM <= shortestM ? shortestM : null;
    };

    /**
     * @type {Readonly<{region: RegionKey, bands: number[], segment: SegmentKey,
     *                 velocityFactor: number, marginPct: number, units: UnitKey,
     *                 heightM: Meters, returnM: Meters, soil: SoilKey,
     *                 tuner: TunerKey,
     *                 wireLenM: Meters, mode: ModeKey, ununRatio: number}>}
     */
    /**
     * Wire length used to be written in feet under ?len=.  New links carry
     * meters under ?len_m=; the old key is still read so links shared before
     * the internals moved to meters resolve to the same wire.
     */
    const LEGACY_LEN_FT_KEY = 'len';

    const DEFAULTS = Object.freeze({
      region: 'us',
      // 80 m is left out.  A random wire is electrically short there and the
      // match through a 9:1 is hard, so including it by default made almost
      // every length fail its worst-band gate on 80 m and told a first-time
      // visitor little about the others.  Selecting it is one click.
      bands: [40, 20, 15, 10],
      segment: 'full',
      mode: 'classical',
      ununRatio: DEFAULT_UNUN_RATIO,
      velocityFactor: DEFAULT_VELOCITY_FACTOR,
      marginPct: DEFAULT_MARGIN_PCT,
      units: 'ft',
      wireLenM: 0,
      heightM: DEFAULT_HEIGHT_M,
      geometry: DEFAULT_GEOMETRY,
      balunM: DEFAULT_BALUN_M,
      counterpoiseM: DEFAULT_COUNTERPOISE_M,
      counterpoiseZM: DEFAULT_COUNTERPOISE_Z_M,
      soil: DEFAULT_SOIL,
      tuner: DEFAULT_TUNER,
    });

    // ============================================================
    // Length math
    // ============================================================

    /**
     * Half wavelength of a wire, in meters.
     * lambda/2 = c / (2 f) scaled by the wire's velocity factor.  With
     * vf = 0.95 this is the familiar 468 / f(MHz) dipole formula in feet.
     *
     * @param {Hertz} freqHz
     * @param {number} velocityFactor
     * @returns {Meters}
     */
    const halfWaveM = (freqHz, velocityFactor) =>
      (C_SPEED / freqHz) * velocityFactor / 2;

    /**
     * Band edges for the selected segment, low frequency first.
     * @param {Band} band
     * @param {SegmentKey} segment
     * @returns {[Hertz, Hertz]}
     */
    const bandEdgesHz = (band, segment) => {
      const [loHz, hiHz] = band[SEGMENTS[segment].key];
      return [loHz, hiHz];
    };

    /**
     * Bands whose geometry sits outside the fit's domain, and which edge.
     *
     * The table is indexed on wire height in wavelengths, so one installation
     * is inside the fit on some bands and outside it on others: 30 ft of wire
     * is 0.06 wavelengths up on 160 m and 1.3 on 10 m.  Outside, interpAt
     * holds the table flat and still returns a number, which is extrapolation
     * whether or not anyone says so.  This is what lets the page say so.
     *
     * @param {Band[]} bands
     * @param {SegmentKey} segment
     * @param {Site} site
     * @returns {{band: Band, edge: 'below'|'above'}[]}
     */
    const outOfDomainBands = (bands, segment, site) => {
      const out = [];
      for (const band of bands) {
        const [loHz, hiHz] = bandEdgesHz(band, segment);
        // Height in wavelengths rises with frequency, so the band's own edges
        // bracket it: the low edge is the lowest h/lambda it reaches.
        const lowest = site.heightM * loHz / C_SPEED;
        const highest = site.heightM * hiHz / C_SPEED;
        if (lowest < MODEL_DOMAIN.minHOverLambda) {
          out.push({ band, edge: /** @type {'below'} */ ('below') });
        } else if (highest > MODEL_DOMAIN.maxHOverLambda) {
          out.push({ band, edge: /** @type {'above'} */ ('above') });
        }
      }
      return out;
    };

    /**
     * The nth half-wave resonance of one band, as a length interval in feet
     * widened by the clearance margin.  An end-fed wire that is a multiple of
     * lambda/2 presents a very high feedpoint impedance (thousands of ohms)
     * that most tuners and 9:1 ununs cannot match.  The band's high frequency
     * gives the short end of the interval.
     *
     * The margin is a fraction of one half wavelength, not of the wire length:
     * what detunes the feedpoint is the offset from resonance measured in
     * wavelengths, which does not grow with n.  Scaling it by n instead would
     * make the nth zone n times wider and swallow every gap between them.
     *
     * @param {Band} band
     * @param {SegmentKey} segment
     * @param {number} velocityFactor
     * @param {number} margin  fraction of a half wavelength
     * @param {number} n       which half-wave multiple
     * @returns {Required<Interval>}
     */
    const resonanceInterval = (band, segment, velocityFactor, margin, n) => {
      const [loHz, hiHz] = bandEdgesHz(band, segment);
      return {
        lo: (n - margin) * halfWaveM(hiHz, velocityFactor),
        hi: (n + margin) * halfWaveM(loHz, velocityFactor),
        label: `${band.label} ${n} x λ/2`,
        kind: 'resonance',
      };
    };

    /**
     * Every resonance interval of every selected band up to maxLenM.  The
     * multiple runs as high as the map needs: a fixed cap would silently stop
     * covering the high bands, whose half wave can be hundreds of times
     * shorter than the map is long.
     *
     * @param {Band[]} bands
     * @param {SegmentKey} segment
     * @param {number} velocityFactor
     * @param {number} marginPct
     * @param {Meters} maxLenM
     * @returns {Required<Interval>[]}
     */
    const avoidIntervals = (bands, segment, velocityFactor, marginPct, maxLenM) => {
      const margin = marginPct / 100;
      const intervals = [];
      for (const band of bands) {
        const shortest = halfWaveM(bandEdgesHz(band, segment)[1], velocityFactor);
        if (!(shortest > 0)) continue;  // degenerate velocity factor
        const highestMultiple = Math.ceil(maxLenM / shortest) + 1;
        for (let n = 1; n <= highestMultiple; n++) {
          const interval = resonanceInterval(band, segment, velocityFactor, margin, n);
          if (interval.lo > maxLenM) break;
          intervals.push(interval);
        }
      }
      return intervals;
    };

    /**
     * A wire shorter than a quarter wave on the lowest selected band is a poor
     * radiator and a hard load for a tuner, so treat it as unusable.
     *
     * @param {Band[]} bands
     * @param {SegmentKey} segment
     * @param {number} velocityFactor
     * @returns {Meters}
     */
    const tooShortM = (bands, segment, velocityFactor) => {
      if (bands.length === 0) return 0;
      const lowestHz = Math.min(...bands.map(b => bandEdgesHz(b, segment)[0]));
      return halfWaveM(lowestHz, velocityFactor) / 2;
    };

    /**
     * Merge overlapping or touching intervals; input need not be sorted.
     * @param {Interval[]} intervals
     * @returns {{lo: Meters, hi: Meters}[]}
     */
    const mergeIntervals = (intervals) => {
      const sorted = [...intervals].sort((a, b) => a.lo - b.lo);
      const merged = [];
      for (const interval of sorted) {
        const last = merged[merged.length - 1];
        if (last && interval.lo <= last.hi) {
          last.hi = Math.max(last.hi, interval.hi);
        } else {
          merged.push({ lo: interval.lo, hi: interval.hi });
        }
      }
      return merged;
    };

    /**
     * Complement of the merged avoid intervals within [0, maxLenM].
     * @param {{lo: Meters, hi: Meters}[]} merged
     * @param {Meters} maxLenM
     * @returns {{lo: Meters, hi: Meters}[]}
     */
    const usableIntervals = (merged, maxLenM) => {
      const usable = [];
      let cursor = 0;
      for (const gap of merged) {
        if (gap.lo > cursor) usable.push({ lo: cursor, hi: Math.min(gap.lo, maxLenM) });
        cursor = Math.max(cursor, gap.hi);
        if (cursor >= maxLenM) break;
      }
      if (cursor < maxLenM) usable.push({ lo: cursor, hi: maxLenM });
      return usable.filter(u => u.hi > u.lo);
    };

    /**
     * Round a length to its unit's grid: whole feet, or half meters.
     *
     * Unlike pickInSpan there is no span to stay inside, so there is nothing
     * for a ladder of roundings to choose between -- one grid per unit is the
     * whole of it.  The grids are deliberately of a size: 1 ft and 0.5 m cost
     * at most 0.02 SWR against the unrounded minimum, so the reader's choice
     * of unit does not change which antenna the page recommends.  A whole
     * meter would be 3.28x coarser than a whole foot, which is what used to
     * hand the two readers different wires.
     *
     * @param {Meters} lenM
     * @param {UnitKey} units
     * @returns {Meters}
     */
    const roundToUnit = (lenM, units) => {
      const step = UNITS[units].roundStep;
      const display = toDisplay(lenM, units);
      return fromDisplay(Number((Math.round(display / step) * step).toFixed(2)),
                         units);
    };

    /**
     * A length to recommend inside a usable span: the roundest number that
     * still lies strictly inside it.  Rounding to a fixed precision would push
     * the pick onto, or past, the edge of a span narrower than that precision,
     * recommending a length the page then reports as one to avoid.
     *
     * @param {{lo: Meters, hi: Meters}} span
     * @param {UnitKey} units  what the number will be read in
     * @returns {Meters}
     */
    const pickInSpan = (span, units) => {
      const center = (span.lo + span.hi) / 2;
      const centerDisplay = toDisplay(center, units);
      for (const step of PICK_STEPS) {
        const rounded = fromDisplay(
          Number((Math.round(centerDisplay / step) * step).toFixed(2)), units);
        if (rounded > span.lo && rounded < span.hi) return rounded;
      }
      return center;
    };

    /**
     * Everything the length map and tables need, derived from the current
     * selection.  All lengths are in meters.
     *
     * @param {RegionKey} region
     * @param {number[]} bandsM      selected bands, by wavelength in meters
     * @param {SegmentKey} segment
     * @param {number} velocityFactor
     * @param {number} marginPct
     * @param {Meters} maxLenM
     * @param {UnitKey} units
     * @returns {{bands: Band[], avoid: Interval[], merged: {lo: Meters, hi: Meters}[],
     *            usable: {lo: Meters, hi: Meters}[], suggestions: Span[], shortLimit: Meters}}
     */
    const solve = (region, bandsM, segment, velocityFactor, marginPct, maxLenM, units) => {
      const bands = bandsIn(region).filter(b => bandsM.includes(b.m));
      const resonances = avoidIntervals(bands, segment, velocityFactor, marginPct, maxLenM);
      const shortLimit = tooShortM(bands, segment, velocityFactor);
      const shortZone = shortLimit > 0
        ? [{ lo: 0, hi: shortLimit, label: 'shorter than λ/4', kind: 'short' }]
        : [];
      const avoid = [...shortZone, ...resonances];
      const merged = mergeIntervals(avoid);
      const usable = usableIntervals(merged, maxLenM);
      const suggestions = [...usable]
        .map(u => ({ ...u, pick: pickInSpan(u, units), clearance: (u.hi - u.lo) / 2 }))
        .sort((a, b) => b.clearance - a.clearance)
        .slice(0, MAX_SUGGESTIONS);
      return { bands, avoid, merged, usable, suggestions, shortLimit };
    };

    /**
     * Recommended length from the usable span nearest to lenM, or null if
     * none is left.  Taken from the middle of the span rather than its closest
     * edge, so the suggestion has the most clearance that span can offer.
     *
     * @param {Meters} lenM
     * @param {{lo: Meters, hi: Meters}[]} usable
     * @param {UnitKey} units
     * @returns {?Meters}
     */
    const nearestClearLength = (lenM, usable, units) => {
      /** @type {?Meters} */
      let best = null;
      for (const span of usable) {
        const center = pickInSpan(span, units);
        if (!best || Math.abs(center - lenM) < Math.abs(best - lenM)) best = center;
      }
      return best;
    };

    /**
     * The largest clearance margin, below the one asked for, that still leaves
     * somewhere to put the wire.  Used to turn "no clear span" into a concrete
     * offer.  Binary search: feasibility is monotonic in the margin, since
     * widening every zone can only remove spans.
     *
     * @param {RegionKey} region
     * @param {number[]} bandsM
     * @param {SegmentKey} segment
     * @param {number} velocityFactor
     * @param {number} askedPct
     * @param {Meters} maxLenM
     * @param {UnitKey} units
     * @returns {?{marginPct:number, lengthM:Meters}} null if even a margin of
     *          zero leaves nothing, i.e. the bands cover every length outright.
     */
    const bestFeasibleMargin = (region, bandsM, segment, velocityFactor,
                                askedPct, maxLenM, units) => {
      /** @param {number} pct */
      const spansAt = (pct) =>
        solve(region, bandsM, segment, velocityFactor, pct, maxLenM, units).suggestions;
      if (spansAt(0).length === 0) return null;

      let feasible = 0;
      let tooWide = askedPct;
      for (let i = 0; i < MARGIN_SEARCH_STEPS; i++) {
        const mid = (feasible + tooWide) / 2;
        if (spansAt(mid).length > 0) feasible = mid; else tooWide = mid;
      }
      // Round down to the slider's step so the offer is one the user can set.
      const marginPct = Math.floor(feasible / MARGIN_STEP_PCT) * MARGIN_STEP_PCT;
      const best = spansAt(marginPct)[0];
      return best ? { marginPct, lengthM: best.pick } : null;
    };

    /**
     * Judge one wire length against the selected bands directly, rather than
     * against the precomputed map intervals, so that lengths past the end of
     * the map are still answered correctly.
     *
     * Only the multiples that can bracket lenM are examined: for band n,
     * lenM lies between the nth and (n+1)th resonance for n around
     * lenM / (half wave).
     *
     * @param {Meters} lenM
     * @param {Band[]} bands
     * @param {SegmentKey} segment
     * @param {number} velocityFactor
     * @param {number} marginPct
     * @param {Meters} shortLimit
     * @returns {?({ok: true, hit: null, nearest: Required<Interval>, clearance: Meters}
     *            | {ok: false, hit: Required<Interval>, nearest: Required<Interval>,
     *               clearance: Meters})}
     *          clearance is the distance in feet to the nearest zone edge.
     */
    const judgeLength = (lenM, bands, segment, velocityFactor, marginPct, shortLimit) => {
      if (!(lenM > 0)) return null;
      const margin = marginPct / 100;
      /** @type {Required<Interval>[]} */
      const zones = [];

      if (shortLimit > 0) {
        zones.push({ lo: 0, hi: shortLimit, label: 'shorter than λ/4', kind: 'short' });
      }
      for (const band of bands) {
        const [loHz, hiHz] = bandEdgesHz(band, segment);
        const shortest = halfWaveM(hiHz, velocityFactor);
        const longest = halfWaveM(loHz, velocityFactor);
        if (!(shortest > 0)) continue;  // degenerate velocity factor
        const nLo = Math.max(1, Math.floor(lenM / longest - margin));
        const nHi = Math.ceil(lenM / shortest + margin);
        for (let n = nLo; n <= nHi; n++) {
          zones.push(resonanceInterval(band, segment, velocityFactor, margin, n));
        }
      }

      // Nothing selected to judge against, so there is no verdict to give.
      if (zones.length === 0) return null;

      const hit = zones.find(z => lenM >= z.lo && lenM <= z.hi) ?? null;

      // Inside a zone, the only distance worth reporting is the way out of
      // that zone; taking a minimum over the others would quote a figure
      // belonging to a zone the message does not name.
      if (hit) {
        return { ok: false, hit, nearest: hit,
                 clearance: Math.min(lenM - hit.lo, hit.hi - lenM) };
      }

      /** @type {?Required<Interval>} */
      let nearest = null;
      let clearance = Infinity;
      for (const zone of zones) {
        const distance = Math.min(Math.abs(lenM - zone.lo), Math.abs(lenM - zone.hi));
        if (distance < clearance) {
          clearance = distance;
          nearest = zone;
        }
      }
      // zones is non-empty here, so the loop above always set nearest.
      return { ok: true, hit: null,
               nearest: /** @type {Required<Interval>} */ (nearest),
               clearance: Number.isFinite(clearance) ? clearance : 0 };
    };

    // ============================================================
    // Feedpoint impedance
    //
    // The keep-out rule above is a proxy: half-wave multiples are bad
    // because the feedpoint impedance spikes there.  This models the
    // impedance directly, so a length can be scored rather than merely
    // accepted or rejected.  It also sees the low impedance of an odd
    // quarter wave, which the keep-out rule cannot express.
    // ============================================================

    /**
     * Minimal complex arithmetic; only what the impedance model needs.
     * @typedef {{re: number, im: number}} Complex
     */
    /** @param {number} re @param {number} im @returns {Complex} */
    const cpx = (re, im) => ({ re, im });
    /** @param {Complex} a @param {Complex} b @returns {Complex} */
    const cAdd = (a, b) => cpx(a.re + b.re, a.im + b.im);
    /** @param {Complex} a @param {Complex} b @returns {Complex} */
    const cSub = (a, b) => cpx(a.re - b.re, a.im - b.im);
    /** @param {Complex} a @param {Complex} b @returns {Complex} */
    const cMul = (a, b) => cpx(a.re * b.re - a.im * b.im, a.re * b.im + a.im * b.re);
    /** @param {Complex} a @param {Complex} b @returns {Complex} */
    const cDiv = (a, b) => {
      const d = b.re * b.re + b.im * b.im;
      return cpx((a.re * b.re + a.im * b.im) / d, (a.im * b.re - a.re * b.im) / d);
    };
    /** @param {Complex} a @returns {number} */
    const cAbs = (a) => Math.hypot(a.re, a.im);
    /** @param {Complex} z @returns {Complex} */
    const cCosh = (z) => cpx(Math.cosh(z.re) * Math.cos(z.im), Math.sinh(z.re) * Math.sin(z.im));
    /** @param {Complex} z @returns {Complex} */
    const cSinh = (z) => cpx(Math.sinh(z.re) * Math.cos(z.im), Math.cosh(z.re) * Math.sin(z.im));
    /** @param {Complex} z @returns {Complex} */
    const cCoth = (z) => cDiv(cCosh(z), cSinh(z));

    /**
     * Average characteristic impedance of a wire antenna, in ohms.
     * Schelkunoff's thin-wire result, Z0 = 60 (ln(2l/a) - 1), for a wire of
     * length l and radius a.
     *
     * @param {Meters} lenM
     * @param {Meters} radiusM
     * @returns {number} ohms
     */
    const wireZ0 = (lenM, radiusM) => 60 * (Math.log(2 * lenM / radiusM) - 1);

    /**
     * Linear interpolation in log10 between table nodes, held flat outside
     * them.  Shared by both lookups so the two axes behave identically.
     *
     * @param {readonly number[]} nodes
     * @param {number[]} values  parallel to nodes
     * @param {number} at
     * @returns {number}
     */
    const interpAt = (nodes, values, at) => {
      const last = nodes.length - 1;
      if (at <= nodes[0]) return values[0];
      if (at >= nodes[last]) return values[last];
      const x = Math.log10(at);
      let i = 0;
      while (i < last && Math.log10(nodes[i + 1]) < x) i++;
      const lo = Math.log10(nodes[i]);
      const hi = Math.log10(nodes[i + 1]);
      const t = (x - lo) / (hi - lo);
      return values[i] + t * (values[i + 1] - values[i]);
    };

    /**
     * One fitted coefficient at a given height in wavelengths.
     *
     * @param {number[]} values  parallel to MODEL_H_NODES
     * @param {number} hOverLam
     * @returns {number}
     */
    const interpCoeff = (values, hOverLam) =>
      interpAt(MODEL_H_NODES, values, hOverLam);

    /**
     * One fitted coefficient that varies with both the wire height and the
     * counterpoise height, interpolated in log10 of each and held flat
     * outside the nodes.  Rows run along MODEL_H_NODES, columns along
     * MODEL_Z_NODES.
     *
     * @param {number[][]} rows
     * @param {number} hOverLam
     * @param {number} zOverLam
     * @returns {number}
     */
    const interpCoeff2 = (rows, hOverLam, zOverLam) => {
      const along = rows.map((row) => interpAt(MODEL_Z_NODES, row, zOverLam));
      return interpAt(MODEL_H_NODES, along, hOverLam);
    };

    /**
     * One transmission line, open at the far end: Z = k Z0 coth(gamma l),
     * with alpha given in nepers per wavelength.
     *
     * @param {Meters} lenM
     * @param {Meters} wavelengthM
     * @param {Meters} radiusM
     * @param {number} alphaPerLambda
     * @param {number} velocityFactor
     * @param {number} z0Scale
     * @returns {Complex} ohms
     */
    const lineZ = (lenM, wavelengthM, radiusM, alphaPerLambda, velocityFactor,
                   z0Scale) => {
      const z0 = z0Scale * wireZ0(lenM, radiusM);
      const alpha = alphaPerLambda / wavelengthM;
      const beta = 2 * Math.PI / (wavelengthM * velocityFactor);
      return cMul(cpx(z0, 0), cCoth(cpx(alpha * lenM, beta * lenM)));
    };

    /**
     * Feedpoint impedance of an end-fed wire, as the antenna line and the
     * return path in series:
     *
     *     Zin = Za(l) + Zr(h + ret)
     *
     * The return path is part of the antenna, not a passive reference.  It
     * radiates, and it resonates on its own with a half-wavelength period in
     * (drop + run); when that nears a half wave it sets the feedpoint outright
     * and the antenna length stops mattering.  About 35 ft of drop plus run is
     * a half wave on 20 m, and the resonance repeats every half wave after
     * that, so across the HF bands most installations sit near one of them.
     *
     * Coefficients are fitted against NEC; see docs/MODEL.md for
     * the sweep, the decomposition it rests on, and the error bound.  This is
     * an envelope, not a prediction of a particular installation.
     *
     * @param {Meters} lenM
     * @param {Hertz} freqHz
     * @param {Site} site
     * @param {Meters} radiusM
     * @returns {Complex} ohms
     */
    const endFedZin = (lenM, freqHz, site, radiusM) => {
      const wavelengthM = C_SPEED / freqHz;
      const coeffs = site.geometry === 'sloper'
        ? MODEL_COEFFS.sloper[site.soil]
        : MODEL_COEFFS.flatTop[site.soil];
      const hOverLam = site.heightM / wavelengthM;
      const zOverLam = site.counterpoiseZM / wavelengthM;
      const returnM = returnConductorM(site);
      const za = lineZ(lenM, wavelengthM, radiusM,
                       interpCoeff(coeffs.alphaA, hOverLam), MODEL_VF_A,
                       interpCoeff(coeffs.kA, hOverLam));
      // The return line is the one that cares how high the counterpoise is,
      // which is why only its three coefficients carry that axis.
      const zr = lineZ(returnM, wavelengthM, radiusM,
                       interpCoeff2(coeffs.alphaR, hOverLam, zOverLam),
                       interpCoeff2(coeffs.vfR, hOverLam, zOverLam),
                       interpCoeff2(coeffs.kR, hOverLam, zOverLam));
      return cAdd(za, zr);
    };

    /**
     * SWR seen at the radio, through the unun, for a feedpoint impedance.
     * @param {Complex} zLoad
     * @param {number} ununRatio  impedance ratio, 1 for a direct connection
     * @returns {number}
     */
    const swrAtRadio = (zLoad, ununRatio) => {
      const zRadio = cpx(zLoad.re / ununRatio, zLoad.im / ununRatio);
      const gamma = cDiv(cSub(zRadio, cpx(Z_SYSTEM_OHMS, 0)),
                         cAdd(zRadio, cpx(Z_SYSTEM_OHMS, 0)));
      const magnitude = Math.min(cAbs(gamma), MAX_GAMMA);
      return (1 + magnitude) / (1 - magnitude);
    };

    /**
     * Score one length against the selected bands: the geometric mean of the
     * SWR at the radio, sampled across every band.
     *
     * The mean is geometric because SWR is a ratio.  A worst-case score was
     * tried first and is useless: the lowest band always sets it, so the score
     * collapses into "prefer the longest wire" no matter what else happens.
     *
     * @param {Meters} lenM
     * @param {Band[]} bands
     * @param {SegmentKey} segment
     * @param {Site} site
     * @param {Meters} radiusM
     * @param {number} ununRatio
     * @returns {?{swr: number, worst: {swr: number, band: Band, freqHz: Hertz}}}
     */
    const scoreLength = (lenM, bands, segment, site, radiusM, ununRatio) => {
      let logSum = 0;
      let count = 0;
      /** @type {?{swr: number, band: Band, freqHz: Hertz}} */
      let worst = null;
      for (const band of bands) {
        const [loHz, hiHz] = bandEdgesHz(band, segment);
        for (let i = 0; i < SWR_SAMPLES_PER_BAND; i++) {
          const freqHz = loHz + (hiHz - loHz) * i / (SWR_SAMPLES_PER_BAND - 1);
          const swr = swrAtRadio(endFedZin(lenM, freqHz, site, radiusM),
                                 ununRatio);
          // A geometry the model cannot describe -- a conductor of no length,
          // or a wire long enough to overflow coth -- yields NaN, which
          // compares false against everything and would be taken downstream
          // for a local minimum.  Decline to score it instead.
          if (!Number.isFinite(swr)) return null;
          logSum += Math.log(swr);
          count++;
          if (worst === null || swr > worst.swr) worst = { swr, band, freqHz };
        }
      }
      if (count === 0 || worst === null) return null;
      return { swr: Math.exp(logSum / count), worst };
    };

    /**
     * @typedef {Object} ScorePoint
     * @property {Meters} lenM
     * @property {number} swr          geometric mean across the selected bands
     * @property {{swr: number, band: Band, freqHz: Hertz}} worst
     */

    /**
     * The worst band of the worst length the classical rule recommends, as
     * SWR at the radio through a transformer.
     *
     * Priced on the recommendations rather than on every length the rule
     * permits.  A user picks from the suggestions, so what the margin is
     * worth to them is what the suggestions are worth; the worst corner of a
     * usable span is a length nobody was offered.
     *
     * The classical rule is arithmetic with no impedance in it, which is its
     * virtue, so this deliberately changes nothing it recommends.  It only
     * says what the margin buys, in the currency the impedance mode already
     * grades in, because a percentage of a half wave means nothing alone.
     * Modeled, therefore, and labeled as such where it is shown.
     *
     * @param {Span[]} suggestions
     * @param {Band[]} bands
     * @param {SegmentKey} segment
     * @param {Site} site
     * @param {number} ununRatio
     * @returns {?number} SWR, or null if nothing was suggested
     */
    const worstSuggestedSwr = (suggestions, bands, segment, site, ununRatio) => {
      let worst = 0;
      for (const span of suggestions) {
        const scored = scoreLength(span.pick, bands, segment, site,
                                   WIRE_RADIUS_M, ununRatio);
        if (scored) worst = Math.max(worst, scored.worst.swr);
      }
      return worst > 0 ? worst : null;
    };

    /**
     * Score the whole length axis, then offer its local minima best first.
     * Only strict minima are offered: a length partway down a slope is always
     * bettered by moving along it, so it is not worth recommending.
     *
     * @param {RegionKey} region
     * @param {number[]} bandsM
     * @param {SegmentKey} segment
     * @param {Site} site
     * @param {Meters} radiusM
     * @param {number} ununRatio
     * @param {Meters} maxLenM
     * @param {UnitKey} units
     * @returns {{bands: Band[], curve: ScorePoint[], suggestions: ScorePoint[],
     *            shortLimit: Meters, shortLabel: string}}
     */
    const solveImpedance = (region, bandsM, segment, site, radiusM,
                            ununRatio, maxLenM, units) => {
      const bands = bandsIn(region).filter(b => bandsM.includes(b.m));
      // The impedance mode does not take a velocity factor; the fitted model
      // carries its own, so the short limit uses the same one.  A sloper
      // cannot be built shorter than its own rise, so its too-short zone
      // covers whichever floor is higher, and the legend says which.
      const buildFloorM = riseShortfallM(site, 0) ?? 0;
      const shortLimit = Math.max(tooShortM(bands, segment, MODEL_VF_A),
                                  buildFloorM);
      const shortLabel = buildFloorM >= shortLimit && buildFloorM > 0
        ? 'shorter than \u03bb/4 or the rise'
        : 'shorter than \u03bb/4';
      if (bands.length === 0) {
        return { bands, curve: [], suggestions: [], shortLimit, shortLabel };
      }

      const step = maxLenM / (SCORE_SAMPLES - 1);
      /** @type {ScorePoint[]} */
      const curve = [];
      for (let i = 0; i < SCORE_SAMPLES; i++) {
        const lenM = Math.max(step, i * step);
        const scored = scoreLength(lenM, bands, segment, site, radiusM,
                                   ununRatio);
        if (scored) curve.push({ lenM, swr: scored.swr, worst: scored.worst });
      }

      // A minimum lands wherever the sample grid happens to fall, so the raw
      // length is an artefact of SCORE_SAMPLES rather than a figure anyone
      // should cut wire to.  Round it the way the classical mode does, then
      // score the rounded length, so the number shown and the SWR beside it
      // describe the same wire.  Two minima can round together, in which case
      // the better one wins.
      /** @type {Map<number, ScorePoint>} */
      const byLength = new Map();
      for (let i = 1; i < curve.length - 1; i++) {
        const point = curve[i];
        if (point.swr >= curve[i - 1].swr || point.swr > curve[i + 1].swr) continue;
        if (point.lenM < shortLimit) continue;
        const lenM = roundToUnit(point.lenM, units);
        if (lenM < shortLimit) continue;
        // A sloper shorter than its own rise cannot be built, whatever it
        // scores: the model was asked about a wire that does not reach.
        if (riseShortfallM(site, lenM) !== null) continue;
        const scored = scoreLength(lenM, bands, segment, site, radiusM, ununRatio);
        if (!scored) continue;
        const existing = byLength.get(lenM);
        if (existing === undefined || scored.swr < existing.swr) {
          byLength.set(lenM, { lenM, swr: scored.swr, worst: scored.worst });
        }
      }

      const suggestions = [...byLength.values()]
        .sort((a, b) => a.swr - b.swr)
        .slice(0, MAX_SUGGESTIONS);
      return { bands, curve, suggestions, shortLimit, shortLabel };
    };

    // ============================================================
    // NEC deck
    // ============================================================

    /**
     * How high the return conductor lies, meters.  Not zero: bonding it to
     * ground would short the source.  This is the geometry the coefficients
     * were fitted at, so a deck built any other way is a different antenna
     * from the one the page just scored; see nec/nec_model.py,
     * which explains why 5 cm stands for a feedline or counterpoise on the
     * soil and does not stand for an elevated one.
     */


    /**
     * Segmentation, matching the fitting runs: 20 segments per wavelength is
     * the usual NEC accuracy rule, and a floor keeps a short wire from being
     * described by two or three.  Counts are made odd so a center segment
     * exists, and capped because NEC-2 builds a dense matrix and the browser
     * solvers this deck is aimed at cap it too.
     */
    const DECK_SEGMENTS_PER_WAVELENGTH = 20;
    const DECK_MIN_SEGMENTS = 9;
    const DECK_MAX_SEGMENTS = 199;


    /** Decimals used for meters, radii and megahertz in a card. */
    const DECK_LEN_DIGITS = 4;
    const DECK_RADIUS_DIGITS = 6;
    const DECK_MHZ_DIGITS = 6;

    /**
     * Segment count for one wire at the top of the sweep, where segments are
     * electrically longest.
     *
     * @param {Meters} lenM
     * @param {Meters} wavelengthM  shortest wavelength in the sweep
     * @returns {number}
     */
    const deckSegments = (lenM, wavelengthM) => {
      const n = Math.ceil(DECK_SEGMENTS_PER_WAVELENGTH * lenM / wavelengthM);
      const bounded = Math.min(Math.max(n, DECK_MIN_SEGMENTS), DECK_MAX_SEGMENTS);
      return bounded % 2 === 0 ? bounded - 1 : bounded;
    };


    /**
     * @typedef {Object} DeckWire  one NEC wire, meters throughout
     * @property {number} tag
     * @property {number} segments
     * @property {Meters} x1
     * @property {Meters} y1
     * @property {Meters} z1
     * @property {Meters} x2
     * @property {Meters} y2
     * @property {Meters} z2
     * @property {Meters} radius
     */

    /**
     * The wires of the installation, as the model was fitted at: the antenna
     * horizontal at the wire height, fed at the end; a vertical drop from the
     * feedpoint to just above ground; and the rest of the return conductor
     * running horizontally at that height, on the bearing its geometry was
     * fitted at (RETURN_DIRECTION).
     *
     * `site.returnM` is the whole return conductor, so the horizontal run is
     * what is left of it after the drop.  A wire of no length is left out
     * rather than emitted as a point.
     *
     * Shared by both exports, so the deck and the project file cannot come to
     * describe two different antennas.
     *
     * @param {Meters} lenM
     * @param {Site} site
     * @param {Meters} radiusM
     * @param {Meters} wavelengthM  shortest wavelength in the sweep
     * @returns {DeckWire[]}
     */
    const deckWires = (lenM, site, radiusM, wavelengthM) => {
      const feedM = feedHeightM(site);
      const runZM = site.counterpoiseZM;
      const dropM = Math.max(feedM - runZM, 0);
      const runM = site.counterpoiseM;
      // A sloper climbs, so its far end is up and the reach is what is left
      // of the wire once the rise is taken out.  A flat top is the same
      // expression with no rise at all.
      const riseM = Math.max(site.heightM - feedM, 0);
      const reachM = Math.sqrt(Math.max(lenM * lenM - riseM * riseM, 0));
      /** @type {DeckWire[]} */
      const wires = [{
        tag: 1, segments: deckSegments(lenM, wavelengthM),
        x1: 0, y1: 0, z1: feedM,
        x2: reachM, y2: 0, z2: site.heightM, radius: radiusM,
      }];
      if (dropM > 0) {
        wires.push({
          tag: 2, segments: deckSegments(dropM, wavelengthM),
          x1: 0, y1: 0, z1: feedM,
          x2: 0, y2: 0, z2: runZM, radius: radiusM,
        });
      }
      if (runM > 0) {
        wires.push({
          tag: 3, segments: deckSegments(runM, wavelengthM),
          x1: 0, y1: 0, z1: runZM,
          x2: RETURN_DIRECTION[site.geometry] * runM, y2: 0, z2: runZM,
          radius: radiusM,
        });
      }
      return wires;
    };

    /**
     * The shortest wavelength a sweep reaches, which is what segmentation has
     * to be adequate at.
     *
     * @param {{startHz: Hertz, stepHz: Hertz, points: number}} sweep
     * @returns {Meters}
     */
    const sweepShortestWaveM = (sweep) =>
      C_SPEED / (sweep.startHz + sweep.stepHz * (sweep.points - 1));

    /**
     * The cards of one probe deck.  The source sits on the first segment
     * of the antenna wire, at the junction with the return, which is where
     * a real unun goes.  Ground is GN 2, the Sommerfeld-Norton solution,
     * with the soil's own constants: GN 1 is a perfect plane and would
     * answer a different question.  Cards are free format, which every
     * NEC-2 reader accepts.
     *
     * @param {Meters} lenM
     * @param {Site} site
     * @param {Meters} radiusM
     * @param {{startHz: Hertz, stepHz: Hertz, points: number}} sweep
     * @param {string[]} comments  CM card bodies
     * @returns {string}
     */
    const deckCards = (lenM, site, radiusM, sweep, comments) => {
      const wires = deckWires(lenM, site, radiusM, sweepShortestWaveM(sweep));
      const soil = SOILS[site.soil];

      const len = (/** @type {Meters} */ value) => value.toFixed(DECK_LEN_DIGITS);
      const mhz = (/** @type {Hertz} */ freqHz) =>
        (freqHz / 1e6).toFixed(DECK_MHZ_DIGITS);

      const cards = [...comments.map(body => `CM ${body}`), 'CE'];
      for (const wire of wires) {
        cards.push(`GW ${wire.tag} ${wire.segments} ${len(wire.x1)} ${len(wire.y1)}`
          + ` ${len(wire.z1)} ${len(wire.x2)} ${len(wire.y2)} ${len(wire.z2)}`
          + ` ${wire.radius.toFixed(DECK_RADIUS_DIGITS)}`);
      }
      cards.push(
        // GE 1: geometry complete, with a ground plane present.
        'GE 1',
        `GN 2 0 0 0 ${soil.epsR} ${soil.sigmaSm}`,
        // EX 0: voltage source, 1 V on tag 1 segment 1, the feedpoint.
        'EX 0 1 1 0 1 0',
        `FR 0 ${sweep.points} 0 0 ${mhz(sweep.startHz)} ${mhz(sweep.stepHz)}`,
        // XQ: execute.  NEC-2 solves at an execution card, not at FR, and a
        // deck ending FR / EN computes nothing at all -- it prints the
        // geometry echo and stops.  XQ inside the sweep runs every frequency
        // and reports the feedpoint at each, which is what this page is about;
        // nec_model.py's fitting runs use the same card.
        'XQ',
        'EN',
      );
      return `${cards.join('\n')}\n`;
    };

    // ============================================================
    // In-page NEC check, the pure half
    // ============================================================

    /**
     * Length samples the check solves, left to right so the curve grows
     * the way it reads.  The model curve draws SCORE_SAMPLES points; NEC
     * solves cost real time, so the check takes a coarser grid.
     */
    const NEC_LENGTH_SAMPLES = 97;

    /**
     * Frequencies the check samples: the model curve's grid
     * (SWR_SAMPLES_PER_BAND per band) at every other point, endpoints
     * included, so the two curves are compared at shared frequencies.  Half
     * the solves buys twice the lengths, and length is the axis with the
     * sharp structure.
     *
     * @param {Band[]} bands
     * @param {SegmentKey} segment
     * @returns {Hertz[]}
     */
    const necSampleFreqsHz = (bands, segment) => {
      /** @type {Hertz[]} */
      const freqs = [];
      for (const band of bands) {
        const [loHz, hiHz] = bandEdgesHz(band, segment);
        for (let i = 0; i < SWR_SAMPLES_PER_BAND; i += 2) {
          freqs.push(loHz + (hiHz - loHz) * i / (SWR_SAMPLES_PER_BAND - 1));
        }
      }
      return freqs;
    };

    /**
     * A single-frequency deck for one probe solve: the exported deck's
     * geometry and ground, segmented for this frequency exactly as the
     * fitting sweeps were.
     *
     * @param {Meters} lenM
     * @param {Hertz} freqHz
     * @param {Site} site
     * @param {Meters} radiusM
     * @returns {string}
     */
    const buildProbeDeck = (lenM, freqHz, site, radiusM) =>
      deckCards(lenM, site, radiusM, { startHz: freqHz, stepHz: 0, points: 1 },
                ['random-wire.html check probe']);

    /**
     * The source impedance in one nec2c output.  The first data row under
     * ANTENNA INPUT PARAMETERS is the source segment; its columns are tag,
     * segment, voltage, current, impedance, admittance, power, so the
     * impedance is fields six and seven.
     *
     * @param {string} output
     * @returns {?Complex}
     */
    const parseNecZ = (output) => {
      const at = output.indexOf('ANTENNA INPUT PARAMETERS');
      if (at < 0) return null;
      for (const line of output.slice(at).split('\n').slice(1)) {
        const fields = line.trim().split(/\s+/);
        if (fields.length < 8 || !/^\d+$/.test(fields[0])) continue;
        const re = Number(fields[6]);
        const im = Number(fields[7]);
        return Number.isFinite(re) && Number.isFinite(im) ? cpx(re, im) : null;
      }
      return null;
    };

    /**
     * The model curve's statistic over measured impedances: the geometric
     * mean of the SWR at the radio, as scoreLength takes it.
     *
     * @param {Complex[]} zs
     * @param {number} ununRatio
     * @returns {?number}
     */
    const geometricMeanSwr = (zs, ununRatio) => {
      if (zs.length === 0) return null;
      let logSum = 0;
      for (const z of zs) {
        const swr = swrAtRadio(z, ununRatio);
        if (!Number.isFinite(swr)) return null;
        logSum += Math.log(swr);
      }
      return Math.exp(logSum / zs.length);
    };

    /**
     * The full grid scoreLength samples, with each frequency's band kept,
     * so a measured worst can name the band the way the model's does.
     *
     * @param {Band[]} bands
     * @param {SegmentKey} segment
     * @returns {{band: Band, freqHz: Hertz}[]}
     */
    const necCheckFreqs = (bands, segment) => {
      /** @type {{band: Band, freqHz: Hertz}[]} */
      const grid = [];
      for (const band of bands) {
        const [loHz, hiHz] = bandEdgesHz(band, segment);
        for (let i = 0; i < SWR_SAMPLES_PER_BAND; i++) {
          grid.push({
            band,
            freqHz: loHz + (hiHz - loHz) * i / (SWR_SAMPLES_PER_BAND - 1),
          });
        }
      }
      return grid;
    };

    /**
     * scoreLength's statistic over measured impedances: geometric mean and
     * the worst sample with its band, so a measured figure sits beside a
     * modeled one on equal terms.  `zs` aligns with `grid`.
     *
     * @param {Complex[]} zs
     * @param {{band: Band, freqHz: Hertz}[]} grid
     * @param {number} ununRatio
     * @returns {?{swr: number, worst: {swr: number, band: Band, freqHz: Hertz}}}
     */
    const measuredScore = (zs, grid, ununRatio) => {
      if (zs.length === 0 || zs.length !== grid.length) return null;
      let logSum = 0;
      /** @type {?{swr: number, band: Band, freqHz: Hertz}} */
      let worst = null;
      for (let i = 0; i < zs.length; i++) {
        const swr = swrAtRadio(zs[i], ununRatio);
        if (!Number.isFinite(swr)) return null;
        logSum += Math.log(swr);
        if (worst === null || swr > worst.swr) {
          worst = { swr, band: grid[i].band, freqHz: grid[i].freqHz };
        }
      }
      if (worst === null) return null;
      return { swr: Math.exp(logSum / zs.length), worst };
    };

    /**
     * How far the measured curve sits from the modeled one: the median,
     * over every measured length, of NEC's SWR against the model's at the
     * nearest scored length.  One number for the statement the overlay
     * makes with its shape.
     *
     * @param {{lenM: Meters, swr: number}[]} necPoints
     * @param {ScorePoint[]} curve
     * @returns {?number}
     */
    const medianOverlayRatio = (necPoints, curve) => {
      if (necPoints.length === 0 || curve.length === 0) return null;
      const ratios = necPoints.map(point => {
        const nearest = curve.reduce((best, sample) =>
          Math.abs(sample.lenM - point.lenM) < Math.abs(best.lenM - point.lenM)
            ? sample : best, curve[0]);
        return point.swr / nearest.swr;
      }).sort((a, b) => a - b);
      return ratios[Math.floor(ratios.length / 2)];
    };

    /**
     * Neighbors whose SWRs disagree by more than this factor mark a span
     * the sweep undersampled; the check then solves its midpoint.  High
     * half-wave multiples of the upper bands are one or two feet wide,
     * against a first-pass grid of a couple of feet.
     */
    const NEC_REFINE_FACTOR = 1.3;

    /**
     * Midpoints of every span the sweep drew too coarsely: wider than
     * `minGapM` and steeper than NEC_REFINE_FACTOR between neighbors.
     * Applied repeatedly this halves rough spans until they are smooth or
     * at `minGapM`, and leaves smooth spans alone.
     *
     * @param {{lenM: Meters, swr: number}[]} points  sorted by length
     * @param {Meters} minGapM  the finest grid worth solving
     * @returns {Meters[]}
     */
    const refineGapsM = (points, minGapM) => {
      /** @type {Meters[]} */
      const midpoints = [];
      for (let i = 1; i < points.length; i++) {
        const left = points[i - 1];
        const right = points[i];
        if (right.lenM - left.lenM < 2 * minGapM) continue;
        const contrast = Math.max(left.swr, right.swr)
          / Math.min(left.swr, right.swr);
        if (contrast > NEC_REFINE_FACTOR) {
          midpoints.push((left.lenM + right.lenM) / 2);
        }
      }
      return midpoints;
    };

    /**
     * Everything the check's numbers depend on, as one string.  The overlay
     * is drawn only while this matches the live state, so any change that
     * would make it stale clears it with no imperative path to forget.
     *
     * @param {Band[]} bands
     * @param {SegmentKey} segment
     * @param {Site} site
     * @param {number} ununRatio
     * @param {Meters} maxLenM
     * @returns {string}
     */
    const necOverlayKey = (bands, segment, site, ununRatio, maxLenM) =>
      JSON.stringify([
        bands.map(band => bandEdgesHz(band, segment)),
        site.geometry, site.heightM, site.balunM, site.counterpoiseM,
        site.counterpoiseZM, site.soil, ununRatio, maxLenM,
      ]);

    /**
     * Fed-element height in wavelengths below which NEC-2's Sommerfeld
     * ground goes wrong -- the method's own failure, not a port's.
     * Measured at the conductivity limit in nec/sommerfeld_report.html:
     * every NEC-2 descendant is exact at 0.05 wavelengths and +92 percent
     * by 0.02.  A low *counterpoise* is the mild case and is not flagged:
     * there nec2c tracks NEC-4.2 to 1 percent down to a centimeter.
     */
    const NEC2_FEED_MIN_LAMBDA = 0.05;

    /**
     * Bands where the check's own solver is suspect: the feedpoint sits
     * under NEC2_FEED_MIN_LAMBDA at the band's low edge, where the
     * wavelength within the band is longest.
     *
     * @param {Band[]} bands
     * @param {SegmentKey} segment
     * @param {Site} site
     * @returns {Band[]}
     */
    const necSuspectBands = (bands, segment, site) =>
      bands.filter(band => {
        const [loHz] = bandEdgesHz(band, segment);
        return feedHeightM(site) / (C_SPEED / loHz) < NEC2_FEED_MIN_LAMBDA;
      });


    // ============================================================
    // Formatting
    // ============================================================

    /** @param {Meters} lenM @param {UnitKey} units @returns {number} */
    const toDisplay = (lenM, units) => lenM * UNITS[units].perMeter;

    /** @param {number} len  in display units @param {UnitKey} units @returns {Meters} */
    const fromDisplay = (len, units) => len / UNITS[units].perMeter;

    /** @param {Meters} lenM @param {UnitKey} units @returns {string} */
    const fmtLen = (lenM, units) => UNITS[units].format(lenM);

    /**
     * Band edges in kHz below 1 MHz, MHz above, so LF bands stay readable.
     * @param {Hertz} loHz
     * @param {Hertz} hiHz
     * @returns {string}
     */
    const fmtBandEdges = (loHz, hiHz) => hiHz < 1e6
      ? `${(loHz / 1e3).toFixed(1)}-${(hiHz / 1e3).toFixed(1)} kHz`
      : `${(loHz / 1e6).toFixed(3)}-${(hiHz / 1e6).toFixed(3)}`;

    /** Unit note for anything printed by fmtBandEdges, which labels only kHz. */
    const BAND_EDGE_UNIT_HINT = 'Frequencies in MHz unless marked';

    /**
     * Tick step in display units that yields roughly TARGET_TICKS ticks.
     * @param {number} spanDisplay
     * @returns {number}
     */
    const tickStep = (spanDisplay) => {
      const ideal = spanDisplay / TARGET_TICKS;
      return TICK_STEPS.find(step => step >= ideal) ?? TICK_STEPS[TICK_STEPS.length - 1];
    };

    // ============================================================
    // URL state
    // ============================================================

    /** @param {number} value @param {{min: number, max: number}} range */
    const clamp = (value, { min, max }) => Math.min(max, Math.max(min, value));

    /** @param {?string} raw @param {number} fallback @returns {number} */
    const parseNum = (raw, fallback) => {
      const value = parseFloat(raw ?? '');
      return Number.isFinite(value) ? value : fallback;
    };

    /**
     * Own properties only.  A bare `key in obj` also matches everything on
     * Object.prototype, so ?region=toString would pass the check and then
     * fail to resolve to a band plan.
     *
     * @template {Object} T
     * @param {T} obj
     * @param {?string} key
     * @returns {key is (string & keyof T)}
     */
    const isKeyOf = (obj, key) =>
      key !== null && Object.prototype.hasOwnProperty.call(obj, key);

    /**
     * Object.entries, keeping the key type.  The built-in widens keys to
     * string, which loses the union the state and lookups are typed on.
     *
     * @template {Object} T
     * @param {T} obj
     * @returns {[string & keyof T, T[string & keyof T]][]}
     */
    const entriesOf = (obj) => /** @type {any} */ (Object.entries(obj));

    /**
     * Wire length from either spelling, preferring the current one.
     * @param {URLSearchParams} params
     * @returns {Meters}
     */
    const readWireLenM = (params) => {
      const meters = params.get(URL_KEYS.wireLenM);
      if (meters !== null) return parseNum(meters, DEFAULTS.wireLenM);
      const feet = params.get(LEGACY_LEN_FT_KEY);
      return feet === null ? DEFAULTS.wireLenM : parseNum(feet, 0) / FT_PER_M;
    };

    /**
     * The counterpoise run, from either spelling of the URL.
     *
     * `?ret_m=` carried the whole return conductor, drop included, and a
     * link written then meant a counterpoise on the ground.  So the run is
     * what is left once the drop is taken off, which resolves such a link to
     * the antenna it always described.
     *
     * @param {URLSearchParams} params
     * @param {Meters} heightM  the wire height the same link carries
     * @returns {Meters}
     */
    const readCounterpoiseM = (params, heightM) => {
      const run = params.get(URL_KEYS.counterpoiseM);
      if (run !== null) return parseNum(run, DEFAULTS.counterpoiseM);
      const whole = params.get(LEGACY_RETURN_KEY);
      if (whole === null) return DEFAULTS.counterpoiseM;
      const dropM = Math.max(heightM - DEFAULT_COUNTERPOISE_Z_M, 0);
      return Math.max(parseNum(whole, 0) - dropM, 0);
    };

    // END PURE
    // Below here the page reads the document.  Everything above, including
    // the URL parsing, takes what it needs as an argument, so the legacy
    // ?len= guarantee can be tested rather than trusted.

    // ============================================================
    // In-page NEC check, the workers
    // ============================================================

    /**
     * The solver, pinned.  The inline build carries the wasm inside the one
     * module, so a worker needs a single cross-origin import and nothing to
     * locate.  nec2c rather than nec2++ because the shipped tables are
     * fitted to NEC-4.2 and nec2c tracks it to 1 percent in this geometry
     * all the way down to a counterpoise at 1 cm, where nec2++ reads half;
     * see docs/MODEL.md, "Where NEC-2 is bad, and where it is not".
     */
    const NEC_WASM_URL =
      'https://unpkg.com/nec2c-wasm@0.1.3/src/runner-inline.mjs';

    /**
     * Module worker body: load the solver once, then answer each message --
     * one length, its decks -- with the output texts in deck order.  Parsing
     * stays on the main thread, in the pure half, where the tests can see it.
     */
    const NEC_WORKER_SOURCE = [
      `import { runNec } from ${JSON.stringify(NEC_WASM_URL)};`,
      'onmessage = async (event) => {',
      '  const { lenM, decks, kind } = event.data;',
      '  try {',
      '    const outputs = [];',
