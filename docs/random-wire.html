      '    for (const deck of decks) outputs.push(await runNec(deck));',
      '    postMessage({ lenM, kind, outputs });',
      '  } catch (error) {',
      '    postMessage({ lenM, kind, error: String(error) });',
      '  }',
      '};',
    ].join('\n');

    /**
     * Workers for one check: solves are independent, so the pool is sized to
     * the machine, capped where more workers stop paying, one kept back for
     * the page itself.
     */
    const NEC_WORKERS_MAX = 8;
    const necWorkerCount = () => Math.min(
      NEC_WORKERS_MAX,
      Math.max(1, (navigator.hardwareConcurrency || NEC_WORKERS_MAX) - 1));

    /**
     * A picture of each arrangement, because the difference between them is
     * geometric and a paragraph describing a shape is a poor substitute for
     * the shape.  Drawn to be read at a glance rather than to scale: the
     * labels name the controls below, so the panel explains itself.
     *
     * @param {{geometry: GeometryKey, selected: boolean}} props
     */
    const GeometryDiagram = ({ geometry, selected }) => {
      const wire = selected ? '#4fd1ab' : '#8a8a8a';
      const line = selected ? '#7a7a7a' : '#555';
      const text = selected ? '#cfcfcf' : '#8a8a8a';
      const feed = selected ? '#e0b341' : '#8a8a8a';
      return (
        <svg viewBox="0 0 200 104" className="geometry-figure"
             role="img" aria-hidden="true" focusable="false">
          <line x1="6" y1="86" x2="194" y2="86" stroke={line} strokeWidth="1.5" />
          {geometry === 'flatTop' ? (
            <g>
              <line x1="34" y1="22" x2="186" y2="22"
                    stroke={wire} strokeWidth="2.5" />
              <line x1="34" y1="22" x2="34" y2="78"
                    stroke={wire} strokeWidth="1.5" />
              <line x1="34" y1="78" x2="104" y2="78"
                    stroke={wire} strokeWidth="1.5" />
              <circle cx="34" cy="22" r="3.5" fill={feed} />
              <text x="42" y="16" fill={text} fontSize="9">wire height</text>
              <text x="42" y="72" fill={text} fontSize="9">counterpoise</text>
            </g>
          ) : (
            <g>
              <line x1="62" y1="74" x2="192" y2="20"
                    stroke={wire} strokeWidth="2.5" />
              <line x1="62" y1="74" x2="62" y2="82"
                    stroke={wire} strokeWidth="1.5" />
              {/* Away from the wire, which is where this geometry was fitted. */}
              <line x1="62" y1="82" x2="10" y2="82"
                    stroke={wire} strokeWidth="1.5" />
              <circle cx="62" cy="74" r="3.5" fill={feed} />
              <text x="120" y="18" fill={text} fontSize="9">free end</text>
              <text x="68" y="64" fill={text} fontSize="9">balun</text>
              <text x="10" y="97" fill={text} fontSize="9">counterpoise</text>
            </g>
          )}
        </svg>
      );
    };

    const getUrlParams = () => {
      const params = new URLSearchParams(window.location.search);
      const rawRegion = params.get(URL_KEYS.region);
      const region = isKeyOf(REGIONS, rawRegion) ? rawRegion : DEFAULTS.region;
      const rawBands = params.get(URL_KEYS.bands);
      const bands = rawBands === null
        ? DEFAULTS.bands
        : rawBands.split(',').map(Number).filter(m => bandsIn(region).some(b => b.m === m));
      const segment = params.get(URL_KEYS.segment);
      const units = params.get(URL_KEYS.units);
      const mode = params.get(URL_KEYS.mode);
      const ununRatio = parseNum(params.get(URL_KEYS.ununRatio), DEFAULTS.ununRatio);
      const soil = params.get(URL_KEYS.soil);
      const tuner = params.get(URL_KEYS.tuner);
      const geometry = params.get(URL_KEYS.geometry);
      const heightM = clamp(
        parseNum(params.get(URL_KEYS.heightM), DEFAULTS.heightM), HEIGHT_RANGE_M);
      const state = {
        region,
        bands,
        segment: isKeyOf(SEGMENTS, segment) ? segment : DEFAULTS.segment,
        mode: isKeyOf(MODES, mode) ? mode : DEFAULTS.mode,
        // An unlisted ratio would leave the control with nothing selected.
        ununRatio: UNUN_RATIOS.includes(ununRatio) ? ununRatio : DEFAULTS.ununRatio,
        velocityFactor: clamp(
          parseNum(params.get(URL_KEYS.velocityFactor), DEFAULTS.velocityFactor),
          VELOCITY_FACTOR_RANGE),
        marginPct: clamp(parseNum(params.get(URL_KEYS.marginPct), DEFAULTS.marginPct),
                         MARGIN_PCT_RANGE),
        units: isKeyOf(UNITS, units) ? units : DEFAULTS.units,
        wireLenM: Math.max(0, readWireLenM(params)),
        heightM,
        geometry: isKeyOf(GEOMETRIES, geometry) ? geometry : DEFAULTS.geometry,
        balunM: clamp(parseNum(params.get(URL_KEYS.balunM), DEFAULTS.balunM),
                      BALUN_RANGE_M),
        counterpoiseM: clamp(readCounterpoiseM(params, heightM),
                             COUNTERPOISE_RANGE_M),
        counterpoiseZM: clamp(
          parseNum(params.get(URL_KEYS.counterpoiseZM), DEFAULTS.counterpoiseZM),
          COUNTERPOISE_Z_RANGE_M),
        soil: isKeyOf(SOILS, soil) ? soil : DEFAULTS.soil,
        tuner: isKeyOf(TUNERS, tuner) ? tuner : DEFAULTS.tuner,
      };
      // A link can name a counterpoise higher than its geometry allows, or a
      // return conductor of no length at all; the range clamps above do not
      // know the geometry, so hold the whole site here.
      return withSiteInvariants(state);
    };

    /**
     * A length the page chose on load counts as a default, so opening the page
     * fresh leaves a clean URL.
     */
    /**
     * @param {ReturnType<typeof getUrlParams>} state
     * @param {?Meters} autoLenM
     * @returns {boolean}
     */
    const isAtDefaults = (state, autoLenM) =>
      state.region === DEFAULTS.region &&
      state.segment === DEFAULTS.segment &&
      state.mode === DEFAULTS.mode &&
      state.ununRatio === DEFAULTS.ununRatio &&
      state.velocityFactor === DEFAULTS.velocityFactor &&
      state.marginPct === DEFAULTS.marginPct &&
      state.units === DEFAULTS.units &&
      state.heightM === DEFAULTS.heightM &&
      state.geometry === DEFAULTS.geometry &&
      state.balunM === DEFAULTS.balunM &&
      state.counterpoiseM === DEFAULTS.counterpoiseM &&
      state.counterpoiseZM === DEFAULTS.counterpoiseZM &&
      state.soil === DEFAULTS.soil &&
      state.tuner === DEFAULTS.tuner &&
      (state.wireLenM === DEFAULTS.wireLenM || state.wireLenM === autoLenM) &&
      state.bands.length === DEFAULTS.bands.length &&
      DEFAULTS.bands.every(m => state.bands.includes(m));

    // ============================================================
    // Components
    // ============================================================

    /** Horizontal map of wire length: red where resonant, green where usable. */
    /**
     * @param {{solution: ReturnType<typeof solve>,
     *          score: ?ReturnType<typeof solveImpedance>,
     *          necPoints: ?{lenM: Meters, swr: number}[],
     *          maxLenM: Meters, units: UnitKey,
     *          wireLenM: Meters, onPick: (lenM: Meters) => void}} props
     */
    function LengthMap({ solution, score, necPoints, maxLenM, units, wireLenM,
                         onPick }) {
      const [hoverM, setHoverM] = useState(/** @type {?Meters} */ (null));

      const plotWidth = MAP.width - MAP.left - MAP.right;
      /** @param {Meters} lenM @returns {number} SVG x */
      const xOf = (lenM) => MAP.left + (lenM / maxLenM) * plotWidth;

      /** @param {number} x  SVG x @returns {Meters} */
      const lenAt = (x) => ((x - MAP.left) / plotWidth) * maxLenM;

      const step = tickStep(toDisplay(maxLenM, units));
      const ticks = [];
      for (let value = 0; value <= toDisplay(maxLenM, units); value += step) {
        ticks.push(value);
      }

      /**
       * Length under the pointer, clamped to the map.
       * @param {React.MouseEvent<SVGSVGElement>} event
       * @returns {Meters}
       */
      const lenAtEvent = (event) => {
        const rect = event.currentTarget.getBoundingClientRect();
        const x = ((event.clientX - rect.left) / rect.width) * MAP.width;
        return Math.max(0, Math.min(maxLenM, lenAt(x)));
      };

      /** @param {React.MouseEvent<SVGSVGElement>} event */
      const handleMove = (event) => setHoverM(lenAtEvent(event));

      const hoverHit = hoverM === null
        ? null
        : solution.avoid.find(a => hoverM >= a.lo && hoverM <= a.hi);

      const plotHeight = score === null ? MAP.barHeight : MAP.curveHeight;
      const barBottom = MAP.top + plotHeight;
      // The viewBox follows the plot, so curve mode gets its room and bar
      // mode keeps its ribbon rather than a field of empty units.
      const svgHeight = score === null ? MAP.height : barBottom + MAP.footer;

      /** SWR plotted logarithmically: it is a ratio, and the range is wide. */
      const yOfSwr = (/** @type {number} */ swr) => barBottom - plotHeight
        * Math.min(1, Math.max(0, Math.log(swr) / Math.log(SWR_PLOT_MAX)));

      const curvePath = score === null ? '' : score.curve
        .map((point, i) => `${i === 0 ? 'M' : 'L'} ${xOf(point.lenM).toFixed(2)} `
          + `${yOfSwr(point.swr).toFixed(2)}`)
        .join(' ');

      // What NEC measured, on the same statistic and the same axes.  Drawn
      // under the model curve and wider, so agreement reads as an amber
      // edging on the green line and disagreement as amber standing alone;
      // on top of it, two matching curves merged into one ambiguous one.
      const necPath = (score === null || necPoints === null
                       || necPoints.length < 2) ? '' : necPoints
        .map((point, i) => `${i === 0 ? 'M' : 'L'} ${xOf(point.lenM).toFixed(2)} `
          + `${yOfSwr(point.swr).toFixed(2)}`)
        .join(' ');

      /** The score under the pointer, for the readout. */
      const hoverScore = (score === null || hoverM === null) ? null
        : score.curve.reduce((best, point) =>
            Math.abs(point.lenM - hoverM) < Math.abs(best.lenM - hoverM) ? point : best,
          score.curve[0]);

      /** The measured point under the pointer, when one is close enough. */
      const hoverNec = (necPoints === null || necPoints.length === 0
                        || hoverM === null) ? null
        : necPoints.reduce((best, point) =>
            Math.abs(point.lenM - hoverM) < Math.abs(best.lenM - hoverM)
              ? point : best,
          necPoints[0]);
      const hoverNecNear = hoverNec !== null && hoverM !== null
        && Math.abs(hoverNec.lenM - hoverM)
           <= maxLenM / (NEC_LENGTH_SAMPLES - 1);

      return (
        <div className="map-container">
          <svg className="map-svg" viewBox={`0 0 ${MAP.width} ${svgHeight}`}
               onMouseMove={handleMove} onMouseLeave={() => setHoverM(null)}
               onClick={(event) => onPick(lenAtEvent(event))}>
            <defs>
              {/* Diagonal hatch marks the too-short zone without relying on hue. */}
              <pattern id="hatch-short" width="8" height="8" patternUnits="userSpaceOnUse"
                       patternTransform="rotate(45)">
                <rect width="8" height="8" fill="#2a2a28" />
                <rect width="3" height="8" fill={COLORS.short} />
              </pattern>
            </defs>
            {/* Usable background */}
            {score === null && solution.usable.map((u, i) => (
              <rect key={`u${i}`} x={xOf(u.lo)} y={MAP.top}
                    width={Math.max(MIN_BAND_WIDTH, xOf(u.hi) - xOf(u.lo))}
                    height={plotHeight}
                    fill={COLORS.usable} stroke={COLORS.usableEdge} strokeWidth="0.5" />
            ))}
            {/* Lengths to avoid */}
            {score === null && solution.avoid.map((a, i) => (
              <rect key={`a${i}`} x={xOf(Math.max(0, a.lo))} y={MAP.top}
                    width={Math.max(MIN_BAND_WIDTH,
                                    xOf(Math.min(a.hi, maxLenM)) - xOf(Math.max(0, a.lo)))}
                    height={plotHeight}
                    fill={a.kind === 'short' ? 'url(#hatch-short)' : COLORS.avoid}
                    opacity={a.kind === 'short' ? 1 : 0.9} />
            ))}
            {/* Modeled SWR, with the too-short zone still marked */}
            {score !== null && (
              <g>
                <rect x={MAP.left} y={MAP.top}
                      width={Math.max(MIN_BAND_WIDTH, xOf(Math.min(score.shortLimit, maxLenM)) - MAP.left)}
                      height={plotHeight} fill="url(#hatch-short)" opacity="0.5" />
                {[2, 5, 10, 30].map(swr => (
                  <g key={swr}>
                    <line className="map-rule"
                          x1={MAP.left} y1={yOfSwr(swr)} x2={MAP.width - MAP.right}
                          y2={yOfSwr(swr)} stroke={COLORS.axis} strokeWidth="0.5"
                          strokeDasharray="3 3" />
                    <text x={MAP.left + 6} y={yOfSwr(swr) - 4} fill={COLORS.label}
                          fontSize={MAP.tickFontSize} textAnchor="start"
                          fontFamily="monospace">{swr}:1</text>
                  </g>
                ))}
                {necPath !== '' && (
                  <g className="nec-curve">
                    <path d={necPath} fill="none" stroke={COLORS.nec}
                          strokeWidth="4" strokeOpacity="0.85" />
                    <text x={MAP.width - MAP.right - 6} y={MAP.top + 12}
                          fill={COLORS.nec} fontSize={MAP.tickFontSize}
                          textAnchor="end" fontFamily="monospace">NEC-2</text>
                  </g>
                )}
                <path d={curvePath} fill="none" stroke={COLORS.usableEdge}
                      strokeWidth="1.5" />
              </g>
            )}
            {/* Axis and ticks */}
            <line x1={MAP.left} y1={barBottom} x2={MAP.width - MAP.right} y2={barBottom}
                  stroke={COLORS.axis} strokeWidth="1" />
            {ticks.map((value) => {
              const x = xOf(fromDisplay(value, units));
              return (
                <g key={value}>
                  <line x1={x} y1={barBottom} x2={x} y2={barBottom + 5}
                        stroke={COLORS.axis} strokeWidth="1" />
                  <text x={x} y={barBottom + 24} fill={COLORS.label} fontSize={MAP.tickFontSize}
                        textAnchor="middle" fontFamily="monospace">{value}</text>
                </g>
              );
            })}
            <text x={MAP.width / 2} y={svgHeight - 4} fill={COLORS.label} fontSize={MAP.axisFontSize}
                  textAnchor="middle" fontFamily="monospace">
              wire length ({UNITS[units].axisLabel})
            </text>
            {/* Selected length marker */}
            {wireLenM > 0 && wireLenM <= maxLenM && (
              <line x1={xOf(wireLenM)} y1={MAP.top - 6} x2={xOf(wireLenM)} y2={barBottom + 3}
                    stroke={COLORS.marker} strokeWidth="2" />
            )}
            {hoverM !== null && (
              <line x1={xOf(hoverM)} y1={MAP.top} x2={xOf(hoverM)} y2={barBottom}
                    stroke="#fff" strokeWidth="1" opacity="0.5" />
            )}
          </svg>
          <div className="map-readout">
            {hoverM === null
              ? 'Click the map to set the wire length.'
              : score !== null && hoverScore
                ? `${fmtLen(hoverM, units)} - SWR ${hoverScore.swr.toFixed(1)}:1 typical, `
                  + `worst ${hoverScore.worst.swr.toFixed(1)}:1 on ${hoverScore.worst.band.label}`
                  + (hoverNecNear && hoverNec !== null
                    ? `, NEC-2 ${hoverNec.swr.toFixed(1)}:1` : '')
                : `${fmtLen(hoverM, units)} - ${hoverHit ? `avoid: ${hoverHit.label}` : 'usable'}`}
          </div>
          <div className="map-legend">
            {score === null ? (
              <>
                <span><span className="swatch" style={{ background: COLORS.avoid }}></span>
                  near a half-wave resonance</span>
                <span><span className="swatch swatch-hatch"></span>
                  shorter than λ/4</span>
                <span><span className="swatch" style={{ background: COLORS.usable,
                  boxShadow: `inset 0 0 0 1px ${COLORS.usableEdge}` }}></span>usable</span>
              </>
            ) : (
              <>
                <span><span className="swatch" style={{ background: COLORS.usableEdge }}></span>
                  modeled SWR at the radio, lower is better</span>
                <span><span className="swatch swatch-hatch"></span>
                  {score.shortLabel}</span>
              </>
            )}
            <span><span className="swatch" style={{ background: COLORS.marker }}></span>
              your wire</span>
          </div>
        </div>
      );
    }

    /**
     * Arrow keys within a group of role="radio" buttons.
     *
     * A screen reader announces "radio button, 1 of 5" and the user reaches
     * for the arrows, so the group has to answer them: the pattern is not
     * optional decoration on the role.  Reading the buttons out of the event
     * target rather than holding refs keeps this one handler for all eight
     * groups, and clicking the next one reuses whatever that option already
     * does rather than duplicating it here.
     *
     * @param {React.KeyboardEvent<HTMLElement>} event
     */
    const onRadioKeys = (event) => {
      const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
      const isEnd = event.key === 'Home' || event.key === 'End';
      const delta = isKeyOf(step, event.key) ? step[event.key] : 0;
      if (delta === 0 && !isEnd) return;
      const options = /** @type {HTMLElement[]} */ ([
        ...event.currentTarget.querySelectorAll('[role="radio"]:not([disabled])'),
      ]);
      if (options.length === 0) return;
      const from = options.findIndex(
        (option) => option === document.activeElement);
      const at = isEnd
        ? (event.key === 'Home' ? 0 : options.length - 1)
        // Wrapping, per the radio group pattern: the ends are not walls.
        : (from + delta + options.length) % options.length;
      event.preventDefault();
      options[at].focus();
      options[at].click();
    };

    function RandomWire() {
      const [p, setP] = useState(getUrlParams);

      /**
       * Stable across renders so effects can depend on it honestly: a fresh
       * closure each render would make any effect listing it run every time.
       *
       * @param {Partial<ReturnType<typeof getUrlParams>>} updates
       */
      const set = useCallback(
        /** @param {Partial<ReturnType<typeof getUrlParams>>} updates */
        // Lowering the wire, or moving to a sloper, lowers the ceiling under a
        // counterpoise height already set, and raising the counterpoise to the
        // feedpoint leaves no drop for a return conductor to be made of.
        (updates) => setP(prev => withSiteInvariants({ ...prev, ...updates })),
        []);

      const { region, bands, segment, velocityFactor, marginPct, units, wireLenM,
              mode, ununRatio, heightM, soil, tuner, geometry, balunM,
              counterpoiseM, counterpoiseZM } = p;

      /** @type {Meters} */
      const counterpoiseCeiling = counterpoiseCeilingM(p);

      /** @type {Site} */
      const site = useMemo(
        () => ({ geometry, heightM, balunM, counterpoiseM, counterpoiseZM, soil }),
        [geometry, heightM, balunM, counterpoiseM, counterpoiseZM, soil]);

      /**
       * A sloper whose wire cannot reach its support, and the length that
       * would.  Null when the antenna is buildable, which is always so for a
       * flat top.
       *
       * @type {?Meters}
       */
      const shortfallM = riseShortfallM(site, wireLenM);

      /**
       * Bands this installation puts outside the fit, if any.  Impedance
       * mode only: the classical rule is arithmetic and has no domain.
       *
       * @type {{band: Band, edge: 'below'|'above'}[]}
       */
      const outsideDomain = useMemo(
        () => (mode === 'impedance'
          ? outOfDomainBands(bandsIn(region).filter(b => bands.includes(b.m)),
                             segment, site)
          : []),
        [mode, region, bands, segment, site]);

      /**
       * The drop from the feedpoint down to the counterpoise, which is part
       * of the return conductor and therefore the floor of it.
       *
       * @type {Meters}
       */
      const dropM = Math.max(feedHeightM(site) - counterpoiseZM, 0);



      /**
       * The velocity factor whatever is on screen should be drawn against.
       *
       * The classical mode's keep-out zones are arithmetic on the user's own
       * velocity factor, so they follow it.  The impedance mode does not use
       * that number at all: its coefficients were fitted with the antenna
       * line at MODEL_VF_A, so half waves drawn at anything else would sit
       * beside peaks the model puts somewhere else.
       */
      const displayVf = mode === 'impedance' ? MODEL_VF_A : velocityFactor;

      const maxLenM = useMemo(
        () => mapSpanM(bandsIn(region).filter(b => bands.includes(b.m)),
                       segment, displayVf),
        [region, bands, segment, displayVf]);

      /**
       * A quarter wave at the lowest selected band, which is the counterpoise
       * length the ARRL specifies, offered as a preset beside the typical
       * coax run.  Null when no band is selected, or when a quarter wave is
       * longer than the control can express.
       */
      const [lowestBandM, quarterWaveReturnM] = useMemo(() => {
        const selected = bandsIn(region).filter(b => bands.includes(b.m));
        if (selected.length === 0) return [0, null];
        const lowest = selected.reduce((a, b) => (a.m > b.m ? a : b));
        const quarterM = halfWaveM(bandEdgesHz(lowest, segment)[0], MODEL_VF_A) / 2;
        return [lowest.m, quarterM > COUNTERPOISE_RANGE_M.max ? null : quarterM];
      }, [region, bands, segment]);

      // units is a dependency because a recommended length is rounded to a
      // round number in whatever unit it will be read in.
      const solution = useMemo(
        () => solve(region, bands, segment, velocityFactor, marginPct, maxLenM, units),
        [region, bands, segment, velocityFactor, marginPct, maxLenM, units]);

      const score = useMemo(
        () => (mode === 'impedance'
          ? solveImpedance(region, bands, segment, site, WIRE_RADIUS_M,
                           ununRatio, maxLenM, units)
          : null),
        [mode, region, bands, segment, site, ununRatio, maxLenM, units]);

      /**
       * The published table lengths, scored by the model, so a length the
       * page declines to recommend is visibly considered rather than absent.
       */
      const publishedScores = useMemo(
        () => (mode === 'impedance' && solution.bands.length > 0
          ? PUBLISHED_FT.map(ft => {
            const lenM = fromDisplay(ft, 'ft');
            const scored = scoreLength(lenM, solution.bands, segment, site,
                                       WIRE_RADIUS_M, ununRatio);
            return { ft, lenM, scored };
          })
          : []),
        [mode, solution, segment, site, ununRatio]);

      /** Fraction of the map the classical rule leaves usable, as a percent. */
      const usablePct = useMemo(
        () => (maxLenM > 0
          ? Math.round(100 * solution.usable.reduce(
            (sum, span) => sum + (span.hi - span.lo), 0) / maxLenM)
          : 0),
        [solution, maxLenM]);

      /**
       * What the classical clearance is worth, priced by the impedance model.
       * Only computed in classical mode, where the number is otherwise a bare
       * percentage; the impedance mode already speaks this currency.
       */
      const marginWorstSwr = useMemo(
        () => (mode === 'classical' && solution.bands.length > 0
          ? worstSuggestedSwr(solution.suggestions, solution.bands, segment,
                              site, ununRatio)
          : null),
        [mode, solution, segment, site, ununRatio]);

      /** Modeled SWR for the length in hand, for the verdict line. */
      const scoreHere = useMemo(
        () => (mode === 'impedance' && wireLenM > 0 && solution.bands.length > 0
          ? scoreLength(wireLenM, solution.bands, segment, site,
                        WIRE_RADIUS_M, ununRatio)
          : null),
        [mode, wireLenM, solution, segment, site, ununRatio]);

      /**
       * @typedef {Object} NecRun  one check, live or finished
       * @property {string} key       necOverlayKey at launch
       * @property {'running'|'done'|'error'} status
       * @property {{lenM: Meters, swr: number}[]} points  sorted by length
       * @property {number} solved    lengths with a point on the map
       * @property {number} scheduled lengths handed to a worker
       * @property {number} total     lengths the grid holds
       * @property {{lenM: Meters, swr: number,
       *             worst: {swr: number, band: Band, freqHz: Hertz}}[]}
       *           checks  the wire in hand and the offered lengths, measured
       * @property {?string} note     what went wrong, when status is error
       */
      const [necRun, setNecRun] = useState(/** @type {?NecRun} */ (null));
      const necControl = useRef(
        /** @type {?{stop: () => void}} */ (null));

      /** What a check of the current state would depend on. */
      const necKey = useMemo(
        () => (mode === 'impedance' && score !== null && score.bands.length > 0
          ? necOverlayKey(score.bands, segment, site, ununRatio, maxLenM)
          : null),
        [mode, score, segment, site, ununRatio, maxLenM]);

      /** The run's one-line self-assessment, for the finished status. */
      const necFactor = useMemo(
        () => (necRun !== null && necRun.key === necKey && score !== null
          ? medianOverlayRatio(necRun.points, score.curve)
          : null),
        [necRun, necKey, score]);

      /** The finished run's measured picks, empty while stale or absent. */
      const necChecks = (necRun !== null && necRun.key === necKey)
        ? necRun.checks : [];
      /** @param {Meters} lenM */
      const necCheckAt = (lenM) =>
        necChecks.find(c => Math.abs(c.lenM - lenM) < 1e-9) ?? null;
      const necHere = necCheckAt(wireLenM);

      /** Bands where the check's own solver is suspect, for the caveat. */
      const necSuspect = useMemo(
        () => (score !== null
          ? necSuspectBands(score.bands, segment, site)
          : []),
        [score, segment, site]);

      // A stale overlay is never drawn (the render checks the key), and a
      // stale run is not worth finishing either.
      useEffect(() => {
        if (necRun !== null && necRun.key !== necKey) {
          if (necControl.current !== null) necControl.current.stop();
          setNecRun(null);
        }
      }, [necRun, necKey]);

      const startNecCheck = () => {
        if (score === null || necKey === null || necControl.current !== null) {
          return;
        }
        const key = necKey;
        const freqs = necSampleFreqsHz(score.bands, segment);
        const step = maxLenM / (NEC_LENGTH_SAMPLES - 1);
        const lengths = Array.from({ length: NEC_LENGTH_SAMPLES },
          (_, i) => Math.max(step, i * step))
          .filter(lenM => riseShortfallM(site, lenM) === null);
        // Once the map is smooth, the run measures the lengths the page
        // actually offers -- the wire in hand and every suggestion -- at
        // scoreLength's full grid, so the table and the verdict can show a
        // measured figure beside each modeled one.
        const codaFreqs = necCheckFreqs(score.bands, segment);
        const codaLengths = [...new Set(
          [wireLenM, ...score.suggestions.map(s => s.lenM)])]
          .filter(lenM => lenM > 0 && riseShortfallM(site, lenM) === null);
        const blobUrl = URL.createObjectURL(
          new Blob([NEC_WORKER_SOURCE], { type: 'text/javascript' }));
        /** @type {Worker[]} */
        const workers = [];
        let nextLength = 0;
        let nextCoda = 0;
        let inCoda = false;
        let pending = 0;
        let solved = 0;
        let concluded = false;
        /** @type {{lenM: Meters, swr: number}[]} */
        const results = [];
        /** @type {NecRun['checks']} */
        const checks = [];

        const snapshot = (/** @type {NecRun['status']} */ status,
                          /** @type {?string} */ note) => ({
          key, status, points: [...results].sort((a, b) => a.lenM - b.lenM),
          solved, scheduled: nextLength, total: lengths.length,
          checks: [...checks], note,
        });
        const conclude = (/** @type {?string} */ error) => {
          if (concluded) return;
          concluded = true;
          workers.forEach(worker => worker.terminate());
          URL.revokeObjectURL(blobUrl);
          necControl.current = null;
          setNecRun(error !== null && results.length === 0
            ? snapshot('error', error)
            : snapshot('done', null));
        };
        // The finest grid refinement reaches: the model curve's own, which
        // is also the natural cap on how many lengths a run may grow to.
        const minGapM = maxLenM / (SCORE_SAMPLES - 1);
        // A solve that fails leaves its gap standing, so an unguarded pass
        // would offer the same midpoint forever.
        const scheduled = new Set(lengths);
        const feed = (/** @type {Worker} */ worker) => {
          if (nextLength < lengths.length) {
            const lenM = lengths[nextLength++];
            pending++;
            worker.postMessage({
              lenM, kind: 'map',
              decks: freqs.map(
                freqHz => buildProbeDeck(lenM, freqHz, site, WIRE_RADIUS_M)),
            });
            return;
          }
          if (!inCoda) {
            if (pending > 0) return;
            // Every worker is idle, so the pass is complete: solve the
            // midpoint of any span it drew too coarsely, and move on to
            // the coda only once the map is smooth.
            const sorted = [...results].sort((a, b) => a.lenM - b.lenM);
            const more = refineGapsM(sorted, minGapM)
              .filter(lenM => riseShortfallM(site, lenM) === null
                && !scheduled.has(lenM))
              .slice(0, Math.max(0, SCORE_SAMPLES - lengths.length));
            if (more.length > 0) {
              more.forEach(lenM => scheduled.add(lenM));
              lengths.push(...more);
              // Through the guarded path for every worker, this one
              // included: falling through here took a length past the end
              // of the queue whenever a round offered fewer midpoints than
              // workers.
              workers.forEach(idle => feed(idle));
              return;
            }
            inCoda = true;
            workers.forEach(idle => feed(idle));
            return;
          }
          if (nextCoda < codaLengths.length) {
            const lenM = codaLengths[nextCoda++];
            pending++;
            worker.postMessage({
              lenM, kind: 'coda',
              decks: codaFreqs.map(
                ({ freqHz }) => buildProbeDeck(lenM, freqHz, site,
                                               WIRE_RADIUS_M)),
            });
            return;
          }
          if (pending === 0) conclude(null);
        };
        const onReply = (
          /** @type {Worker} */ worker,
          /** @type {{lenM: Meters, kind?: string, outputs?: string[],
                      error?: string}} */
          data) => {
          if (concluded) return;
          pending--;
          if (data.error !== undefined || data.outputs === undefined) {
            conclude(data.error ?? 'the solver returned nothing');
            return;
          }
          const zs = data.outputs.map(parseNecZ);
          if (zs.every(z => z !== null)) {
            const measured = /** @type {Complex[]} */ (zs);
            if (data.kind === 'coda') {
              const scored = measuredScore(measured, codaFreqs, ununRatio);
              if (scored !== null) checks.push({ lenM: data.lenM, ...scored });
            } else {
              const swr = geometricMeanSwr(measured, ununRatio);
              if (swr !== null) {
                results.push({ lenM: data.lenM, swr });
                solved++;
              }
            }
          }
          setNecRun(snapshot('running', null));
          feed(worker);
        };

        for (let i = 0; i < necWorkerCount(); i++) {
          const worker = new Worker(blobUrl, { type: 'module' });
          worker.onmessage = (event) => onReply(worker, event.data);
          worker.onerror = () => {
            pending = Math.max(0, pending - 1);
            conclude('the solver failed to load');
          };
          workers.push(worker);
        }
        necControl.current = { stop: () => conclude(null) };
        setNecRun(snapshot('running', null));
        workers.forEach(feed);
      };


      // Only searched when the asked-for margin leaves nothing.
      const fallback = useMemo(
        () => (solution.suggestions.length > 0 || bands.length === 0
          ? null
          : bestFeasibleMargin(region, bands, segment, velocityFactor, marginPct,
                               maxLenM, units)),
        [solution, region, bands, segment, velocityFactor, marginPct, maxLenM, units]);

      const clearLength = useMemo(
        () => nearestClearLength(wireLenM, solution.usable, units),
        [wireLenM, solution, units]);

      const verdict = useMemo(
        () => judgeLength(wireLenM, solution.bands, segment, velocityFactor,
                          marginPct, solution.shortLimit),
        [wireLenM, solution, segment, velocityFactor, marginPct]);

      // Jump to the best length whenever the inputs change, so the answer
      // always suits the current selection.  Typing a length or picking one
      // off the map leaves the solution alone, so those stick until an input
      // changes.  A length in the URL wins on first load.
      //
      // The dependencies are the physical inputs rather than the derived
      // solution and score.  Those two are rebuilt when `units` changes, since
      // a recommendation is rounded in the unit it will be read in, and
      // depending on them meant switching feet to meters silently replaced a
      // length the user had typed or clicked.  Nothing physical changes when
      // the unit does.
      const autoLenM = useRef(/** @type {?Meters} */ (null));
      const firstRun = useRef(true);
      const bestLenM = mode === 'impedance'
        ? (score ? score.suggestions[0]?.lenM : undefined)
        : solution.suggestions[0]?.pick;

      /**
       * What the recommendation actually depends on, as one comparable value.
       * The display unit is deliberately absent: it re-rounds a pick but
       * changes no physics, and treating it as an input is what let a unit
       * switch discard a length the user had typed.
       */
      const inputSignature = [region, bands.join(','), segment, mode, heightM,
                              geometry, balunM, counterpoiseM, counterpoiseZM,
                              soil, ununRatio, velocityFactor,
                              marginPct].join('|');
      const lastSignature = useRef(inputSignature);

      useEffect(() => {
        const wasFirstRun = firstRun.current;
        const changed = lastSignature.current !== inputSignature;
        firstRun.current = false;
        lastSignature.current = inputSignature;
        if (bestLenM === undefined) return;
        // A length in the URL wins on first load.
        if (wasFirstRun && wireLenM > 0) return;
        // After that, only a real input change moves a length the user set;
        // a page-chosen length is re-rounded whenever the unit changes.
        const userChose = autoLenM.current === null || wireLenM !== autoLenM.current;
        if (!wasFirstRun && !changed && userChose) return;
        if (bestLenM === wireLenM) return;
        autoLenM.current = bestLenM;
        set({ wireLenM: bestLenM });
      }, [inputSignature, bestLenM, wireLenM, set]);

      useEffect(() => {
        if (isAtDefaults(p, autoLenM.current)) {
          window.history.replaceState(null, '', window.location.pathname);
          return;
        }
        // Read from `p` rather than the destructured locals, so the single
        // dependency below is honestly the whole of what this writes.
        const params = new URLSearchParams();
        params.set(URL_KEYS.region, p.region);
        params.set(URL_KEYS.bands, p.bands.join(','));
        params.set(URL_KEYS.segment, p.segment);
        params.set(URL_KEYS.mode, p.mode);
        params.set(URL_KEYS.ununRatio, String(p.ununRatio));
        params.set(URL_KEYS.velocityFactor, String(p.velocityFactor));
        params.set(URL_KEYS.heightM, String(p.heightM));
        params.set(URL_KEYS.geometry, p.geometry);
        if (p.geometry === 'sloper') params.set(URL_KEYS.balunM, String(p.balunM));
        params.set(URL_KEYS.counterpoiseM, String(p.counterpoiseM));
        params.set(URL_KEYS.counterpoiseZM, String(p.counterpoiseZM));
        params.set(URL_KEYS.soil, p.soil);
        params.set(URL_KEYS.tuner, p.tuner);
        params.set(URL_KEYS.marginPct, String(p.marginPct));
        params.set(URL_KEYS.units, p.units);
        if (p.wireLenM > 0) params.set(URL_KEYS.wireLenM, p.wireLenM.toFixed(3));
        window.history.replaceState(null, '', `${window.location.pathname}?${params}`);
      }, [p]);

      /** @param {number} m  band wavelength in meters */
      const toggleBand = (m) => set({
        bands: bands.includes(m) ? bands.filter(x => x !== m) : [...bands, m].sort((a, b) => b - a),
      });

      /**
       * Switching region drops any selected band that region does not have.
       * @param {RegionKey} key
       */
      const setRegion = (key) => set({
        region: key,
        bands: bands.filter(m => bandsIn(key).some(b => b.m === m)),
      });

      /** @param {Meters} lenM */
      const setWireLen = (lenM) => {
        if (!Number.isFinite(lenM)) return;
        set({ wireLenM: Math.max(0,
          fromDisplay(Number(toDisplay(lenM, units).toFixed(2)), units)) });
      };

      /**
       * What the length field shows while it is being typed in.  A controlled
       * field formatted on every keystroke fights the user: a partial number
       * like "5." reformats to "5.00" mid-entry, and an empty field or a
       * stray character parses to NaN.  The draft holds whatever was typed
       * until focus leaves, and only finite values reach the model.
       */
      const [lenDraft, setLenDraft] = useState(/** @type {?string} */ (null));
      const lenShown = lenDraft ?? toDisplay(wireLenM, units).toFixed(2);

      const noBands = bands.length === 0;

      return (
        <div className="app">
          {mode === 'impedance' && (
            <div className="ribbon"><span>EXPERIMENTAL</span></div>
          )}
          <h1 className="title">End-Fed Wire Antenna Length Calculator</h1>
          <div className="footer">
            End-fed wire lengths that dodge half-wave resonances on the bands you pick
          </div>

          <div className="main-content">
            <div className="column">
              <div className="panel">
                <div className="panel-header">Method</div>
                <div className="segment-toggle" role="radiogroup" aria-label="Method"
                     onKeyDown={onRadioKeys}>
                  {entriesOf(MODES).map(([key, def]) => (
                    <button key={key}
                            className={`btn segment-btn ${mode === key ? 'active' : ''}`}
                            role="radio" aria-checked={mode === key}
                            tabIndex={mode === key ? 0 : -1}
                            onClick={() => set({ mode: key })}>
                      {def.label}
                    </button>
                  ))}
                </div>
                <div className="control-hint">{MODES[mode].note}</div>
              </div>

              <div className="panel">
                <div className="panel-header">Band plan</div>
                <div className="presets" role="radiogroup" aria-label="Band plan"
                     onKeyDown={onRadioKeys}>
                  {entriesOf(REGIONS).map(([key, def]) => (
                    <button key={key}
                            className={`btn preset-btn ${region === key ? 'active' : ''}`}
                            role="radio" aria-checked={region === key}
                            tabIndex={region === key ? 0 : -1}
                            onClick={() => setRegion(key)}>
                      {def.label}
                    </button>
                  ))}
                </div>
                <div className="control-hint">{REGIONS[region].note}</div>
              </div>

              <div className="panel">
                <div className="panel-header">Bands of interest</div>
                <div className="presets">
                  {PRESETS.map(preset => (
                    <button key={preset.label} className="btn preset-btn"
                            onClick={() => set({ bands: [...preset.bands] })}>
                      {preset.label}
                    </button>
                  ))}
                </div>
                <div className="segment-toggle" role="radiogroup" aria-label="Segment"
                     onKeyDown={onRadioKeys}>
                  {entriesOf(SEGMENTS).map(([key, def]) => (
                    <button key={key}
                            className={`btn segment-btn ${segment === key ? 'active' : ''}`}
                            role="radio" aria-checked={segment === key}
                            tabIndex={segment === key ? 0 : -1}
                            onClick={() => set({ segment: key })}>
                      {def.label}
                    </button>
                  ))}
                </div>
                <div className="band-grid">
                  {bandsIn(region).map(band => {
                    const [lo, hi] = bandEdgesHz(band, segment);
                    return (

                  <div className="control-hint">
                    0.95 gives the classic λ/2 = 468 / f(MHz) feet. The impedance

            <div className="column column-wide">
              <div className={`verdict ${mode === 'impedance'

                  {' '}{UNITS[units].abbrev}
                  {mode === 'impedance'

              {!noBands && necKey !== null && necSuspect.length > 0 && (

                  {NEC2_FEED_MIN_LAMBDA} wavelengths on{' '}

                  <a href={MODEL_NOTE_URL} target="_blank"

                      {necFactor !== null

              {!noBands && (

                      <tbody>

                                {fmtLen(s.pick, units)}

                    </table>

              {mode === 'impedance' && publishedScores.length > 0 && (

                    The lengths the usual tables offer, run through this model at

                    fitted against NEC, uses 1.0 &mdash; about 5% longer, which
                    moves what counts as clear of a resonance. Click one to try

                    <em>and</em> on its worst band; several of these are fine on
                    average and unusable on one.
                  </div>
                  <table>
                    <thead>
                      <tr><th>Length</th><th>Average</th><th>Worst band</th>
                          <th>Verdict</th></tr>
                    </thead>
                    <tbody>
                      {publishedScores.map(({ ft, lenM, scored }) => (
                        <tr key={ft} className="pick">
                          <td className="best-length">
                            <button className="pick-btn"

                          <td className={isGoodScore(scored, tuner)

              {!noBands && (

                  <table>
                    <thead>

                </div>

          </div>

          <div className="info">
            <p>
              An end-fed wire whose length is a multiple of a half wavelength presents a
              very high feedpoint impedance (thousands of ohms), which most tuners and 9:1
              ununs handle badly. <strong>Pick a length that misses every half-wave multiple
              on every band you plan to use</strong>, and keep it at least a quarter wave
              long on the lowest band.
            </p>
            <p>
              Lengths here are physical wire lengths using λ/2 = c / (2 f) times the
              velocity factor; at 0.95 that is the familiar 468 / f(MHz) feet. Real wire
              near ground, with insulators and a counterpoise, will differ, so favor
              lengths with generous margin. A counterpoise or radial system is still
              required; the feedpoint impedance also depends on it.
            </p>
            <p>
              US band edges are from{' '}
              <a href="https://www.law.cornell.edu/cfr/text/47/97.301">47 CFR 97.301</a>
              {' '}as summarized by the{' '}
              <a href="https://www.arrl.org/frequency-allocations">ARRL frequency chart</a>,
