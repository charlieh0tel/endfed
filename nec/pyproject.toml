[project]
name = "random-wire-nec"
version = "0.1.0"
description = "Offline NEC modeling behind the random-wire.html impedance model."
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "pynec>=2.3.4",
    "numpy>=2.0",
    "scipy>=1.14",
]

[dependency-groups]
# Pinned like everything else here: a ruff that reformats on its own schedule
# would fail CI on a commit that changed nothing.
dev = ["ruff>=0.14,<0.15"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# ASCII only: non-ASCII identifiers, and ambiguous characters in strings,
# docstrings and comments.
extend-select = ["PLC2401", "RUF001", "RUF002", "RUF003"]
