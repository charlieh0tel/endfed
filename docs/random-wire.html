          const hi = Math.min(profile.length - 1, lo + 1);
          const value = (profile[lo] + (profile[hi] - profile[lo])
            * (pos - lo)) / peak;
          if (value > envelope[i]) envelope[i] = value;
        }
      }
      return envelope;
    };

    /**
     * The floor across bands: the pointwise minimum of per-band envelopes,
     * so a dip is a place the wire stays quiet on every band.  This is the
     * union view's one honest measured statistic -- the maximum washes out,
     * which is why the union draws markers and a floor rather than a peak
     * trace.
     *
     * @param {Object<number, {volts: number[], amps: number[]}>} profiles
     * @returns {?{volts: number[], amps: number[]}}
     */
    const profileFloor = (profiles) => {
      const bands = Object.values(profiles);
      if (bands.length === 0) return null;
      /** @param {'volts' | 'amps'} kind @returns {number[]} */
      const floorOf = (kind) => {
        const first = bands[0][kind];
        const floor = [...first];
        for (const band of bands.slice(1)) {
          for (let i = 0; i < floor.length; i++) {
            if (band[kind][i] < floor[i]) floor[i] = band[kind][i];
          }
        }
        return floor;
      };
      return { volts: floorOf('volts'), amps: floorOf('amps') };
    };

    /**
     * The model curve's statistic over measured impedances: the geometric
     * mean of the SWR at the radio, as scoreLength takes it.
     *
     * @param {Complex[]} zs
     * @param {number} ununRatio
     * @returns {?number}
     */
    const geometricMeanSwr = (zs, ununRatio) => {
      if (zs.length === 0) return null;
      let logSum = 0;
      for (const z of zs) {
        const swr = swrAtRadio(z, ununRatio);
        if (!Number.isFinite(swr)) return null;
        logSum += Math.log(swr);
      }
      return Math.exp(logSum / zs.length);
    };

    /**
     * The full grid scoreLength samples, with each frequency's band kept,
     * so a measured worst can name the band the way the model's does.
     *
     * @param {Band[]} bands
     * @param {SegmentKey} segment
     * @returns {{band: Band, freqHz: Hertz}[]}
     */
    const necCheckFreqs = (bands, segment) => {
      /** @type {{band: Band, freqHz: Hertz}[]} */
      const grid = [];
      for (const band of bands) {
        const [loHz, hiHz] = bandEdgesHz(band, segment);
        for (let i = 0; i < SWR_SAMPLES_PER_BAND; i++) {
          grid.push({
            band,
            freqHz: loHz + (hiHz - loHz) * i / (SWR_SAMPLES_PER_BAND - 1),
          });
        }
      }
      return grid;
    };

    /**
     * scoreLength's statistic over measured impedances: geometric mean and
     * the worst sample with its band, so a measured figure sits beside a
     * modeled one on equal terms.  `zs` aligns with `grid`.
     *
     * @param {Complex[]} zs
     * @param {{band: Band, freqHz: Hertz}[]} grid
     * @param {number} ununRatio
     * @returns {?{swr: number, worst: {swr: number, band: Band, freqHz: Hertz}}}
     */
    const measuredScore = (zs, grid, ununRatio) => {
      if (zs.length === 0 || zs.length !== grid.length) return null;
      let logSum = 0;
      /** @type {?{swr: number, band: Band, freqHz: Hertz}} */
      let worst = null;
      for (let i = 0; i < zs.length; i++) {
        const swr = swrAtRadio(zs[i], ununRatio);
        if (!Number.isFinite(swr)) return null;
        logSum += Math.log(swr);
        if (worst === null || swr > worst.swr) {
          worst = { swr, band: grid[i].band, freqHz: grid[i].freqHz };
        }
      }
      if (worst === null) return null;
      return { swr: Math.exp(logSum / zs.length), worst };
    };

    /**
     * How far the measured curve sits from the modeled one: the median,
     * over every measured length, of the followed line's SWR against the model's at the
     * nearest scored length.  One number for the statement the overlay
     * makes with its shape.
     *
     * @param {{lenM: Meters, best: number}[]} necPoints
     * @param {ScorePoint[]} curve
     * @returns {?number}
     */
    const medianOverlayRatio = (necPoints, curve) => {
      if (necPoints.length === 0 || curve.length === 0) return null;
      const ratios = necPoints.map(point => {
        const nearest = curve.reduce((best, sample) =>
          Math.abs(sample.lenM - point.lenM) < Math.abs(best.lenM - point.lenM)
            ? sample : best, curve[0]);
        return point.best / nearest.swr;
      }).sort((a, b) => a - b);
      return ratios[Math.floor(ratios.length / 2)];
    };

    /**
     * Standing-wave maxima along the wire at one frequency, as distances
     * from the feed, meters.  The far end is open: current is zero there
     * and voltage peaks, so voltage maxima sit at whole half-waves back
     * from the end and current maxima at odd quarter-waves, at the wire's
     * own velocity (the jacket slows it).
     *
     * @param {Meters} lenM
     * @param {Hertz} freqHz
     * @param {Site} site
     * @returns {{volts: Meters[], amps: Meters[]}}
     */
    const waveMaximaM = (lenM, freqHz, site) => {
      const vf = MODEL_VF_A * wireOf(site).lengthScale;
      const quarterM = (C_SPEED / freqHz) * vf / 4;
      /** @type {Meters[]} */
      const volts = [];
      /** @type {Meters[]} */
      const amps = [];
      for (let k = 0; k * 2 * quarterM <= lenM; k++) {
        volts.push(lenM - k * 2 * quarterM);
      }
      for (let k = 0; (2 * k + 1) * quarterM <= lenM; k++) {
        amps.push(lenM - (2 * k + 1) * quarterM);
      }
      return { volts, amps };
    };

    /** Points the band sweep view draws across one band. */
    const BAND_SWEEP_POINTS = 33;

    /**
     * Modeled SWR across one band for the wire in hand: the analyzer's
     * view, frequency on the x axis, where the map fixes frequency and
     * sweeps length.
     *
     * @param {Meters} lenM
     * @param {Band} band
     * @param {SegmentKey} segment
     * @param {Site} site
     * @param {Meters} radiusM
     * @param {number} ununRatio
     * @returns {{freqHz: Hertz, swr: number}[]}  empty when unscorable
     */
    const bandSweep = (lenM, band, segment, site, radiusM, ununRatio) => {
      const [loHz, hiHz] = bandEdgesHz(band, segment);
      /** @type {{freqHz: Hertz, swr: number}[]} */
      const points = [];
      for (let i = 0; i < BAND_SWEEP_POINTS; i++) {
        const freqHz = loHz + (hiHz - loHz) * i / (BAND_SWEEP_POINTS - 1);
        const swr = swrAtRadio(endFedZin(lenM, freqHz, site, radiusM),
                               ununRatio);
        if (!Number.isFinite(swr)) return [];
        points.push({ freqHz, swr });
      }
      return points;
    };

    /**
     * Neighbors whose SWRs disagree by more than this factor mark a span
     * the sweep undersampled; the check then solves its midpoint.  High
     * half-wave multiples of the upper bands are one or two feet wide,
     * against a first-pass grid of a couple of feet.
     */
    const NEC_REFINE_FACTOR = 1.3;

    /**
     * Midpoints of every span the sweep drew too coarsely: wider than
     * `minGapM` and steeper than NEC_REFINE_FACTOR between neighbors.
     * Applied repeatedly this halves rough spans until they are smooth or
     * at `minGapM`, and leaves smooth spans alone.
     *
     * @param {{lenM: Meters, best: number}[]} points  sorted by length
     * @param {Meters} minGapM  the finest grid worth solving
     * @returns {Meters[]}
     */
    const refineGapsM = (points, minGapM) => {
      /** @type {Meters[]} */
      const midpoints = [];
      for (let i = 1; i < points.length; i++) {
        const left = points[i - 1];
        const right = points[i];
        if (right.lenM - left.lenM < 2 * minGapM) continue;
        // Refined on the reading the map draws: bisecting nec2c's curve
        // where the page does not follow it spent the whole refinement
        // budget sharpening a line nobody sees.
        const contrast = Math.max(left.best, right.best)
          / Math.min(left.best, right.best);
        if (contrast > NEC_REFINE_FACTOR) {
          midpoints.push((left.lenM + right.lenM) / 2);
        }
      }
      return midpoints;
    };

    /**
     * Everything the check's numbers depend on, as one string.  The overlay
     * is drawn only while this matches the live state, so any change that
     * would make it stale clears it with no imperative path to forget.
     *
     * @param {Band[]} bands
     * @param {SegmentKey} segment
     * @param {Site} site
     * @param {number} ununRatio
     * @param {Meters} maxLenM
     * @returns {string}
     */
    const necOverlayKey = (bands, segment, site, ununRatio, maxLenM) =>
      JSON.stringify([
        bands.map(band => bandEdgesHz(band, segment)),
        site.geometry, site.heightM, site.balunM, site.counterpoiseM,
        site.counterpoiseZM, site.soil, site.wire ?? DEFAULT_WIRE,
        ununRatio, maxLenM,
      ]);

    /**
     * Fed-element height in wavelengths below which NEC-2's Sommerfeld
     * ground goes wrong -- the method's own failure, not a port's.
     * Measured at the conductivity limit in nec/sommerfeld_report.html:
     * every NEC-2 descendant is exact at 0.05 wavelengths and +92 percent
     * by 0.02.  A low *counterpoise* is the mild case and is not flagged:
     * there nec2c tracks NEC-4.2 to 1 percent down to a centimeter.
     */
    const NEC2_FEED_MIN_LAMBDA = 0.05;

    /**
     * Bands where the check's own solver is suspect: the feedpoint sits
     * under NEC2_FEED_MIN_LAMBDA at the band's low edge, where the
     * wavelength within the band is longest.
     *
     * @param {Band[]} bands
     * @param {SegmentKey} segment
     * @param {Site} site
     * @returns {Band[]}
     */
    const necSuspectBands = (bands, segment, site) =>
      bands.filter(band => {
        const [loHz] = bandEdgesHz(band, segment);
        return feedHeightM(site) / (C_SPEED / loHz) < NEC2_FEED_MIN_LAMBDA;
      });


    // ============================================================
    // Formatting
    // ============================================================

    /** @param {Meters} lenM @param {UnitKey} units @returns {number} */
    const toDisplay = (lenM, units) => lenM * UNITS[units].perMeter;

    /** @param {number} len  in display units @param {UnitKey} units @returns {Meters} */
    const fromDisplay = (len, units) => len / UNITS[units].perMeter;

    /** @param {Meters} lenM @param {UnitKey} units @returns {string} */
    const fmtLen = (lenM, units) => UNITS[units].format(lenM);

    /**
     * Band edges in kHz below 1 MHz, MHz above, so LF bands stay readable.
     * @param {Hertz} loHz
     * @param {Hertz} hiHz
     * @returns {string}
     */
    const fmtBandEdges = (loHz, hiHz) => hiHz < 1e6
      ? `${(loHz / 1e3).toFixed(1)}-${(hiHz / 1e3).toFixed(1)} kHz`
      : `${(loHz / 1e6).toFixed(3)}-${(hiHz / 1e6).toFixed(3)}`;

    /** Unit note for anything printed by fmtBandEdges, which labels only kHz. */
    const BAND_EDGE_UNIT_HINT = 'Frequencies in MHz unless marked';

    /**
     * Tick step in display units that yields roughly TARGET_TICKS ticks.
     * @param {number} spanDisplay
     * @returns {number}
     */
    const tickStep = (spanDisplay) => {
      const ideal = spanDisplay / TARGET_TICKS;
      return TICK_STEPS.find(step => step >= ideal) ?? TICK_STEPS[TICK_STEPS.length - 1];
    };

    // ============================================================
    // URL state
    // ============================================================

    /** @param {number} value @param {{min: number, max: number}} range */
    const clamp = (value, { min, max }) => Math.min(max, Math.max(min, value));

    /** @param {?string} raw @param {number} fallback @returns {number} */
    const parseNum = (raw, fallback) => {
      const value = parseFloat(raw ?? '');
      return Number.isFinite(value) ? value : fallback;
    };

    /**
     * Own properties only.  A bare `key in obj` also matches everything on
     * Object.prototype, so ?region=toString would pass the check and then
     * fail to resolve to a band plan.
     *
     * @template {Object} T
     * @param {T} obj
     * @param {?string} key
     * @returns {key is (string & keyof T)}
     */
    const isKeyOf = (obj, key) =>
      key !== null && Object.prototype.hasOwnProperty.call(obj, key);

    /**
     * Object.entries, keeping the key type.  The built-in widens keys to
     * string, which loses the union the state and lookups are typed on.
     *
     * @template {Object} T
     * @param {T} obj
     * @returns {[string & keyof T, T[string & keyof T]][]}
     */
    const entriesOf = (obj) => /** @type {any} */ (Object.entries(obj));

    /**
     * Wire length from either spelling, preferring the current one.
     * @param {URLSearchParams} params
     * @returns {Meters}
     */
    const readWireLenM = (params) => {
      const meters = params.get(URL_KEYS.wireLenM);
      if (meters !== null) return parseNum(meters, DEFAULTS.wireLenM);
      const feet = params.get(LEGACY_LEN_FT_KEY);
      return feet === null ? DEFAULTS.wireLenM : parseNum(feet, 0) / FT_PER_M;
    };

    /**
     * The counterpoise run, from either spelling of the URL.
     *
     * `?ret_m=` carried the whole return conductor, drop included, and a
     * link written then meant a counterpoise on the ground.  So the run is
     * what is left once the drop is taken off, which resolves such a link to
     * the antenna it always described.
     *
     * @param {URLSearchParams} params
     * @param {Meters} heightM  the wire height the same link carries
     * @returns {Meters}
     */
    const readCounterpoiseM = (params, heightM) => {
      const run = params.get(URL_KEYS.counterpoiseM);
      if (run !== null) return parseNum(run, DEFAULTS.counterpoiseM);
      const whole = params.get(LEGACY_RETURN_KEY);
      if (whole === null) return DEFAULTS.counterpoiseM;
      const dropM = Math.max(heightM - DEFAULT_COUNTERPOISE_Z_M, 0);
      return Math.max(parseNum(whole, 0) - dropM, 0);
    };

    // END PURE
    // Below here the page reads the document.  Everything above, including
    // the URL parsing, takes what it needs as an argument, so the legacy
    // ?len= guarantee can be tested rather than trusted.

    // ============================================================
    // In-page NEC check, the workers
    // ============================================================

    /**
     * The solver, pinned.  The inline build carries the wasm inside the one
     * module, so a worker needs a single cross-origin import and nothing to
     * locate.  nec2c rather than nec2++ because the shipped tables are
     * fitted to NEC-4.2 and nec2c tracks it to 1 percent in this geometry
     * all the way down to a counterpoise at 1 cm, where nec2++ reads half;
     * see docs/MODEL.md, "Where NEC-2 is bad, and where it is not".
     */
    const NEC_WASM_URL =
      'https://unpkg.com/nec2c-wasm@0.1.3/src/runner-inline.mjs';

    /**
     * The second solver, nec2++, driven through its API rather than a deck
     * and answering with numbers.  Loaded lazily and guarded: if it cannot
     * be had the check runs on nec2c alone and says so by drawing no band.
     */
    const NECPP_WASM_URL = 'https://unpkg.com/necpp-wasm@0.2.2/src/runner.mjs';
    const NECPP_BINARY_URL =
      'https://unpkg.com/necpp-wasm@0.2.2/prebuilts/necpp.wasm';

    /**
     * Module worker body: load the solvers once, then answer each message
     * -- one length, its decks and the same decks as nec2++ models -- with
     * nec2c's output texts and nec2++'s impedances in deck order.  Parsing
     * stays on the main thread, in the pure half, where the tests can see it.
     */
    const NEC_WORKER_SOURCE = [
      `import { runNec } from ${JSON.stringify(NEC_WASM_URL)};`,
      `const necpp = import(${JSON.stringify(NECPP_WASM_URL)}).catch(() => null);`,
      `const locateFile = () => ${JSON.stringify(NECPP_BINARY_URL)};`,
      'const alternate = async (model) => {',
      '  const lib = await necpp;',
      '  if (lib === null) return null;',
      '  const nec = await lib.createContext({ locateFile });',
      '  try {',
      '    return nec.solveModel(model).feeds[0].impedance;',
      '  } finally {',
      '    nec.dispose();',
      '  }',
      '};',
      'onmessage = async (event) => {',
      '  const { lenM, decks, models, kind } = event.data;',
      '  try {',
      '    const outputs = [];',
      '    const alternates = [];',
      '    for (let i = 0; i < decks.length; i++) {',
      '      outputs.push(await runNec(decks[i]));',
      '      let z = null;',
      '      try { z = await alternate(models[i]); } catch { z = null; }',
      '      alternates.push(z);',
      '    }',
      '    postMessage({ lenM, kind, outputs, alternates });',
      '  } catch (error) {',
      '    postMessage({ lenM, kind, error: String(error) });',
      '  }',
      '};',
    ].join('\n');

    /**
     * nec2++'s answers off a worker message as complex numbers, or null
     * unless every deck got one: a half-measured length is no measurement.
     * @param {({re: number, im: number} | null)[] | undefined} alternates
     * @param {number} count
     * @returns {?Complex[]}
     */
    const alternatesOf = (alternates, count) => {
      if (alternates === undefined || alternates.length !== count
          || alternates.some(z => z === null)) {
        return null;
      }
      return alternates.map(z => cpx(
        /** @type {{re: number, im: number}} */ (z).re,
        /** @type {{re: number, im: number}} */ (z).im));
    };

    /**
     * Workers for one check: solves are independent, so the pool is sized to
     * the machine, capped where more workers stop paying, one kept back for
     * the page itself.
     */
    const NEC_WORKERS_MAX = 8;

    /**
     * How long a changed wire length sits still before the follow solve
     * measures it: long enough to skip every intermediate value of a drag
     * or a spinner, short enough to feel attached.
     */
    const NEC_FOLLOW_DELAY_MS = 400;
    const necWorkerCount = () => Math.min(
      NEC_WORKERS_MAX,
      Math.max(1, (navigator.hardwareConcurrency || NEC_WORKERS_MAX) - 1));

    /**
     * A picture of each arrangement, because the difference between them is
     * geometric and a paragraph describing a shape is a poor substitute for
     * the shape.  Drawn to be read at a glance rather than to scale: the
     * labels name the controls below, so the panel explains itself.
     *
     * @param {{geometry: GeometryKey, selected: boolean}} props
     */
    const GeometryDiagram = ({ geometry, selected }) => {
      const wire = selected ? '#4fd1ab' : '#8a8a8a';
      const line = selected ? '#7a7a7a' : '#555';
      const text = selected ? '#cfcfcf' : '#8a8a8a';
      const feed = selected ? '#e0b341' : '#8a8a8a';
      return (
        <svg viewBox="0 0 200 104" className="geometry-figure"
             role="img" aria-hidden="true" focusable="false">
          <line x1="6" y1="86" x2="194" y2="86" stroke={line} strokeWidth="1.5" />
          {geometry === 'flatTop' ? (
            <g>
              <line x1="34" y1="22" x2="186" y2="22"
                    stroke={wire} strokeWidth="2.5" />
              <line x1="34" y1="22" x2="34" y2="78"
                    stroke={wire} strokeWidth="1.5" />
              <line x1="34" y1="78" x2="104" y2="78"
                    stroke={wire} strokeWidth="1.5" />
              <circle cx="34" cy="22" r="3.5" fill={feed} />
              <text x="42" y="16" fill={text} fontSize="9">wire height</text>
              <text x="42" y="72" fill={text} fontSize="9">counterpoise</text>
            </g>
          ) : (
            <g>
              <line x1="62" y1="74" x2="192" y2="20"
                    stroke={wire} strokeWidth="2.5" />
              <line x1="62" y1="74" x2="62" y2="82"
                    stroke={wire} strokeWidth="1.5" />
              {/* Away from the wire, which is where this geometry was fitted. */}
              <line x1="62" y1="82" x2="10" y2="82"
                    stroke={wire} strokeWidth="1.5" />
              <circle cx="62" cy="74" r="3.5" fill={feed} />
              <text x="120" y="18" fill={text} fontSize="9">free end</text>
              <text x="68" y="64" fill={text} fontSize="9">balun</text>
              <text x="10" y="97" fill={text} fontSize="9">counterpoise</text>
            </g>
          )}
        </svg>
      );
    };

    const getUrlParams = () => {
      const params = new URLSearchParams(window.location.search);
      const rawRegion = params.get(URL_KEYS.region);
      const region = isKeyOf(REGIONS, rawRegion) ? rawRegion : DEFAULTS.region;
      const rawBands = params.get(URL_KEYS.bands);
      const bands = rawBands === null
        ? DEFAULTS.bands
        : rawBands.split(',').map(Number).filter(m => bandsIn(region).some(b => b.m === m));
      const segment = params.get(URL_KEYS.segment);
      const units = params.get(URL_KEYS.units);
      const mode = params.get(URL_KEYS.mode);
      const ununRatio = parseNum(params.get(URL_KEYS.ununRatio), DEFAULTS.ununRatio);
      const soil = params.get(URL_KEYS.soil);
      const wire = params.get(URL_KEYS.wire);
      const tuner = params.get(URL_KEYS.tuner);
      const geometry = params.get(URL_KEYS.geometry);
      const heightM = clamp(
        parseNum(params.get(URL_KEYS.heightM), DEFAULTS.heightM), HEIGHT_RANGE_M);
      const state = {
        region,
        bands,
        segment: isKeyOf(SEGMENTS, segment) ? segment : DEFAULTS.segment,
        mode: isKeyOf(MODES, mode) ? mode : DEFAULTS.mode,
        // An unlisted ratio would leave the control with nothing selected.
        ununRatio: UNUN_RATIOS.includes(ununRatio) ? ununRatio : DEFAULTS.ununRatio,
        velocityFactor: clamp(
          parseNum(params.get(URL_KEYS.velocityFactor), DEFAULTS.velocityFactor),
          VELOCITY_FACTOR_RANGE),
        marginPct: clamp(parseNum(params.get(URL_KEYS.marginPct), DEFAULTS.marginPct),
                         MARGIN_PCT_RANGE),
        units: isKeyOf(UNITS, units) ? units : DEFAULTS.units,
        wireLenM: Math.max(0, readWireLenM(params)),
        heightM,
        geometry: isKeyOf(GEOMETRIES, geometry) ? geometry : DEFAULTS.geometry,
        balunM: clamp(parseNum(params.get(URL_KEYS.balunM), DEFAULTS.balunM),
                      BALUN_RANGE_M),
        counterpoiseM: clamp(readCounterpoiseM(params, heightM),
                             COUNTERPOISE_RANGE_M),
        counterpoiseZM: clamp(
          parseNum(params.get(URL_KEYS.counterpoiseZM), DEFAULTS.counterpoiseZM),
          COUNTERPOISE_Z_RANGE_M),
        soil: isKeyOf(SOILS, soil) ? soil : DEFAULTS.soil,
        wire: isKeyOf(WIRES, wire) ? wire : DEFAULTS.wire,
        tuner: isKeyOf(TUNERS, tuner) ? tuner : DEFAULTS.tuner,
      };
      // A link can name a counterpoise higher than its geometry allows, or a
      // return conductor of no length at all; the range clamps above do not
      // know the geometry, so hold the whole site here.
      return withSiteInvariants(state);
    };

    /**
     * A length the page chose on load counts as a default, so opening the page
     * fresh leaves a clean URL.
     */
    /**
     * @param {ReturnType<typeof getUrlParams>} state
     * @param {?Meters} autoLenM
     * @returns {boolean}
     */
    const isAtDefaults = (state, autoLenM) =>
      state.region === DEFAULTS.region &&
      state.segment === DEFAULTS.segment &&
      state.mode === DEFAULTS.mode &&
      state.ununRatio === DEFAULTS.ununRatio &&
      state.velocityFactor === DEFAULTS.velocityFactor &&
      state.marginPct === DEFAULTS.marginPct &&
      state.units === DEFAULTS.units &&
      state.heightM === DEFAULTS.heightM &&
      state.geometry === DEFAULTS.geometry &&
      state.balunM === DEFAULTS.balunM &&
      state.counterpoiseM === DEFAULTS.counterpoiseM &&
      state.counterpoiseZM === DEFAULTS.counterpoiseZM &&
      state.soil === DEFAULTS.soil &&
      state.wire === DEFAULTS.wire &&
      state.tuner === DEFAULTS.tuner &&
      (state.wireLenM === DEFAULTS.wireLenM || state.wireLenM === autoLenM) &&
      state.bands.length === DEFAULTS.bands.length &&
      DEFAULTS.bands.every(m => state.bands.includes(m));

    // ============================================================
    // Components
    // ============================================================

    /**
     * SWR against frequency across one band, for a fixed wire: the view an
     * antenna analyzer gives, where the length map fixes frequency and
     * sweeps length.  Shares the map's log SWR axis and colors.
     *
     * @param {{points: {freqHz: Hertz, swr: number}[],
     *          band: Band, segment: SegmentKey, limit: number,
     *          measured: {m: number, freqHz: Hertz, swr: number}[]}} props
     */
    function BandSweep({ points, band, segment, limit, measured }) {
      const width = 1000;
      const height = 240;
      const top = 10;
      // The SWR labels live in a left margin so the plot starts clear of
      // them rather than running underneath.
      const left = 64;
      const right = 8;
      const plotHeight = height - 54;
      const bottom = top + plotHeight;
      const [loHz, hiHz] = bandEdgesHz(band, segment);
      /** @param {Hertz} freqHz @returns {number} SVG x */
      const xOf = (freqHz) =>
        left + (freqHz - loHz) / (hiHz - loHz) * (width - left - right);
      // A band sweep lives in a narrower range than the length map: its
      // own ceiling keeps the region the tuner argument happens in tall.
      // Anything above it is drawn as an arrow at the top edge.
      const SWEEP_PLOT_MAX = 15;
      /** @param {number} swr @returns {number} SVG y */
      const yOf = (swr) => top + plotHeight - plotHeight
        * Math.min(1, Math.max(0, Math.log(swr) / Math.log(SWEEP_PLOT_MAX)));
      const path = points
        .map((point, i) => `${i === 0 ? 'M' : 'L'} ${xOf(point.freqHz).toFixed(2)} `
          + `${yOf(point.swr).toFixed(2)}`)
        .join(' ');
      /** Frequency gridlines at the quarters, labeled at the edges and center. */
      const ticks = [0, 0.25, 0.5, 0.75, 1].map(fraction => ({
        freqHz: loHz + (hiHz - loHz) * fraction,
        labeled: fraction === 0 || fraction === 0.5 || fraction === 1,
      }));
      return (
        <svg className="map-svg" viewBox={`0 0 ${width} ${height}`}>
          <defs>
            {/* Same language as the map's too-short zone: hatched is out. */}
            <pattern id="hatch-limit" width="8" height="8"
                     patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
              <rect width="8" height="8" fill="#2a2a28" />
              <rect width="3" height="8" fill={COLORS.short} />
            </pattern>
          </defs>
          <rect x={left} y={top} width={width - left - right}
                height={Math.max(0, yOf(limit) - top)}
                fill="url(#hatch-limit)" opacity="0.5" />
          <line x1={left} y1={yOf(limit)} x2={width - right} y2={yOf(limit)}
                stroke={COLORS.avoid} strokeWidth="1" />
          <text x={width - right - 6} y={yOf(limit) + 16} fill={COLORS.label}
                fontSize={MAP.tickFontSize} textAnchor="end"
                fontFamily="monospace">tuner {limit}:1</text>
          {[2, 5, 10].map(swr => (
            <g key={swr}>
              <line className="map-rule"
                    x1={left} y1={yOf(swr)} x2={width - right} y2={yOf(swr)}
                    stroke={COLORS.axis} strokeWidth="0.5"
                    strokeDasharray="3 3" />
              <text x={left - 8} y={yOf(swr) + 5} fill={COLORS.label}
                    fontSize={MAP.tickFontSize} textAnchor="end"
                    fontFamily="monospace">{swr}:1</text>
            </g>
          ))}
          {ticks.map(({ freqHz, labeled }) => (
            <g key={freqHz}>
              <line className="map-rule"
                    x1={xOf(freqHz)} y1={top} x2={xOf(freqHz)} y2={bottom}
                    stroke={COLORS.axis} strokeWidth="0.5"
                    strokeDasharray="3 3" />
              {labeled && (
                <text x={xOf(freqHz)} y={height - 8} fill={COLORS.label}
                      fontSize={MAP.tickFontSize}
                      textAnchor={freqHz === loHz ? 'start'
                        : freqHz === hiHz ? 'end' : 'middle'}
                      fontFamily="monospace">
                  {(freqHz / 1e6).toFixed(3)}{freqHz !== loHz
                    && freqHz !== hiHz ? ' MHz' : ''}</text>
              )}
            </g>
          ))}
          <path d={path} fill="none" stroke={COLORS.usableEdge}
                strokeWidth="1.5" />
          {(() => {
            // Where the modeled curve pegs the ceiling, one arrow at its
            // worst frequency says "keeps going".
            const over = points.filter(point => point.swr > SWEEP_PLOT_MAX);
            if (over.length === 0) return null;
            const peak = over.reduce(
              (worst, point) => (point.swr > worst.swr ? point : worst));
            const x = xOf(peak.freqHz);
            return <polygon points={`${x - 7},${top + 14} ${x + 7},${top + 14} ${x},${top}`}
                            fill={COLORS.usableEdge} />;
          })()}
          {measured.map((sample, i) => (
            sample.swr > SWEEP_PLOT_MAX
              ? <polygon key={i}
                         points={`${xOf(sample.freqHz) - 7},${top + 14} ${xOf(sample.freqHz) + 7},${top + 14} ${xOf(sample.freqHz)},${top}`}
                         fill={COLORS.nec} />
              : <circle key={i} cx={xOf(sample.freqHz)} cy={yOf(sample.swr)}
                        r="5" fill={COLORS.nec} />
          ))}
        </svg>
      );
    }

    /**
     * The wire drawn twice, feed at the left: voltage maxima marked on the
     * top row, current maxima on the bottom, the union of every selected
     * band.  Positions come from waveMaximaM; each marker names its band.
     *
     * @param {{maxima: {volts: {posM: Meters, label: string}[],
     *                   amps: {posM: Meters, label: string}[]},
     *          measured: ?{volts: number[], amps: number[]},
     *          lenM: Meters, units: UnitKey}} props
     */
    function WaveMaxima({ maxima, measured, lenM, units }) {
      const width = 1000;
      const height = 148;
      const left = 90;
      const right = 16;
      const rows = { volts: 30, amps: 74 };
      const axisY = 104;
      /** @param {Meters} posM @returns {number} SVG x */
      const xOf = (posM) => left + (posM / lenM) * (width - left - right);
      // The same tick machinery as the length map, in display units.
      const step = tickStep(toDisplay(lenM, units));
      const ticks = [];
      for (let value = 0; value <= toDisplay(lenM, units); value += step) {
        ticks.push(value);
      }
      /**
       * A measured envelope riding its row: normalized 0..1 mapped to a
       * lobe above the row line.
       * @param {number[]} profile
       * @param {number} rowY
       * @returns {string}
       */
      const profilePath = (profile, rowY) => profile
        .map((value, i) => `${i === 0 ? 'M' : 'L'} `
          + `${(left + (i / (profile.length - 1)) * (width - left - right)).toFixed(1)} `
          + `${(rowY - 4 - value * 20).toFixed(1)}`)
        .join(' ');
      return (
        <svg className="map-svg" viewBox={`0 0 ${width} ${height}`}>
          {measured !== null && (
            <g>
              <path d={profilePath(measured.volts, rows.volts)} fill="none"
                    stroke={COLORS.avoid} strokeWidth="1.5" opacity="0.8" />
              <path d={profilePath(measured.amps, rows.amps)} fill="none"
                    stroke={COLORS.usableEdge} strokeWidth="1.5"
                    opacity="0.8" />
            </g>
          )}
          {entriesOf(rows).map(([kind, y]) => (
            <g key={kind}>
              <text x={left - 10} y={y + 5} fill={COLORS.label}
                    fontSize={MAP.tickFontSize} textAnchor="end"
                    fontFamily="monospace">
                {kind === 'volts' ? 'voltage' : 'current'}</text>
              <line x1={left} y1={y} x2={width - right} y2={y}
                    stroke={COLORS.axis} strokeWidth="1" />
            </g>
          ))}
          {maxima.volts.map((mark, i) => (
            <g key={`v${i}`}>
              <polygon points={`${xOf(mark.posM) - 6},${rows.volts + 8} ${xOf(mark.posM) + 6},${rows.volts + 8} ${xOf(mark.posM)},${rows.volts - 8}`}
                       fill={COLORS.avoid}>
                <title>{`${mark.label}, ${fmtLen(mark.posM, units)} from the feed`}</title>
              </polygon>
            </g>
          ))}
          {maxima.amps.map((mark, i) => (
            <circle key={`a${i}`} cx={xOf(mark.posM)} cy={rows.amps} r="6"
                    fill={COLORS.usableEdge}>
              <title>{`${mark.label}, ${fmtLen(mark.posM, units)} from the feed`}</title>
            </circle>
          ))}
          <line x1={left} y1={axisY} x2={width - right} y2={axisY}
                stroke={COLORS.axis} strokeWidth="1" />
          {ticks.map(value => (
            <g key={value}>
              <line x1={xOf(fromDisplay(value, units))} y1={axisY}
                    x2={xOf(fromDisplay(value, units))} y2={axisY + 5}
                    stroke={COLORS.axis} strokeWidth="1" />
              <text x={xOf(fromDisplay(value, units))} y={axisY + 24}
                    fill={COLORS.label} fontSize={MAP.tickFontSize}
                    textAnchor="middle" fontFamily="monospace">{value}</text>
            </g>
          ))}
          <text x={left} y={height - 4} fill={COLORS.label}
                fontSize={MAP.tickFontSize} fontFamily="monospace">feed</text>
          <text x={width - right} y={height - 4} fill={COLORS.label}
                fontSize={MAP.tickFontSize} textAnchor="end"
                fontFamily="monospace">
            far end, {fmtLen(lenM, units)}</text>
        </svg>
      );
    }

    /** Horizontal map of wire length: red where resonant, green where usable. */
    /**
     * @param {{solution: ReturnType<typeof solve>,
     *          score: ?ReturnType<typeof solveImpedance>,
     *          necPoints: ?{lenM: Meters, swr: number, alt: ?number,
     *                        best: number, cred: boolean}[],
     *          maxLenM: Meters, units: UnitKey,
     *          wireLenM: Meters, onPick: (lenM: Meters) => void}} props
     */
    function LengthMap({ solution, score, necPoints, maxLenM, units, wireLenM,
                         onPick }) {
      const [hoverM, setHoverM] = useState(/** @type {?Meters} */ (null));
      // What the live region last said.  Filled only by the keyboard
      // handler, so a screen reader hears each keyed change and nothing
      // re-announces on an unrelated render.
      const [liveText, setLiveText] = useState('');

      const plotWidth = MAP.width - MAP.left - MAP.right;
      /** @param {Meters} lenM @returns {number} SVG x */
      const xOf = (lenM) => MAP.left + (lenM / maxLenM) * plotWidth;

      /** @param {number} x  SVG x @returns {Meters} */
      const lenAt = (x) => ((x - MAP.left) / plotWidth) * maxLenM;

      /** The axis end in the display unit, for ticks and the slider. */
      const maxDisplay = toDisplay(maxLenM, units);

      const step = tickStep(maxDisplay);
      const ticks = [];
      for (let value = 0; value <= maxDisplay; value += step) {
        ticks.push(value);
      }

      /**
       * Length under the pointer, clamped to the map.
       * @param {React.MouseEvent<SVGSVGElement>} event
       * @returns {Meters}
       */
      const lenAtEvent = (event) => {
        const rect = event.currentTarget.getBoundingClientRect();
        const x = ((event.clientX - rect.left) / rect.width) * MAP.width;
        return Math.max(0, Math.min(maxLenM, lenAt(x)));
      };

      /** @param {React.MouseEvent<SVGSVGElement>} event */
      const handleMove = (event) => setHoverM(lenAtEvent(event));

      /**
       * The avoid zone holding a length, for the readout and the slider text.
       * @param {Meters} lenM
       * @returns {Interval | undefined}
       */
      const zoneAt = (lenM) =>
        solution.avoid.find(a => lenM >= a.lo && lenM <= a.hi);

      const hoverHit = hoverM === null ? null : zoneAt(hoverM);

      const plotHeight = score === null ? MAP.barHeight : MAP.curveHeight;
      const barBottom = MAP.top + plotHeight;
      // The viewBox follows the plot, so curve mode gets its room and bar
      // mode keeps its ribbon rather than a field of empty units.
      const svgHeight = score === null ? MAP.height : barBottom + MAP.footer;

      /** SWR plotted logarithmically: it is a ratio, and the range is wide. */
      const yOfSwr = (/** @type {number} */ swr) => barBottom - plotHeight
        * Math.min(1, Math.max(0, Math.log(swr) / Math.log(SWR_PLOT_MAX)));

      const curvePath = score === null ? '' : score.curve
        .map((point, i) => `${i === 0 ? 'M' : 'L'} ${xOf(point.lenM).toFixed(2)} `
          + `${yOfSwr(point.swr).toFixed(2)}`)
        .join(' ');

      // What NEC measured, on the same statistic and the same axes.  Drawn
      // under the model curve and wider, so agreement reads as an amber
      // edging on the green line and disagreement as amber standing alone;
      // on top of it, two matching curves merged into one ambiguous one.
      /**
       * One SVG path through points, at a reading of each.
       * @param {{lenM: Meters, swr: number, alt: ?number, best: number,
       *           cred: boolean}[]} points
       * @param {(point: {swr: number, alt: ?number, best: number}) => number} swrOf
       */
      const pathThrough = (points, swrOf) => points
        .map((point, i) => `${i === 0 ? 'M' : 'L'} ${xOf(point.lenM).toFixed(2)} `
          + `${yOfSwr(swrOf(point)).toFixed(2)}`)
        .join(' ');
      const runs = (score === null || necPoints === null) ? null
        : necRuns(necPoints);
      // The line: the reading the page follows, solver by solver as the
      // measured rule prefers.
      const necPath = (runs === null || necPoints === null
                       || necPoints.length < 2) ? ''
        : pathThrough(necPoints, point => point.best);
      // Where they part, a band between them with two thin edges and no
      // line: the check's own uncertainty, drawn rather than asserted.
      // Out along the higher reading and back along the lower.
      const high = (/** @type {{swr: number, alt: ?number}} */ point) =>
        Math.max(point.swr, point.alt ?? point.swr);
      const low = (/** @type {{swr: number, alt: ?number}} */ point) =>
        Math.min(point.swr, point.alt ?? point.swr);
      const necSplits = runs === null ? [] : runs.split.filter(run => run.length >= 2);
      // What the legend should admit to: whether nec2c has any credible
      // stretch on this map, and whether a band is actually drawn.
      const necAnyCred = necPoints !== null
        && necPoints.some(point => point.cred !== false);
      const necBand = necSplits.map(run =>
        `${pathThrough(run, high)} ${[...run].reverse()
          .map(point => `L ${xOf(point.lenM).toFixed(2)} ${yOfSwr(low(point)).toFixed(2)}`)
          .join(' ')} Z`).join(' ');
      // Each solver's own edge of the band: nec2c solid, nec2++ dashed.
      const necEdges = necSplits.flatMap(run => [
        { d: pathThrough(run, point => point.swr), dashed: false },
        { d: pathThrough(run, point => point.alt ?? point.swr), dashed: true },
      ]);

      /**
       * The scored point nearest a length, or null in classical mode.
       * @param {Meters} lenM
       * @returns {?ScorePoint}
       */
      const scoreNear = (lenM) => score === null ? null
        : score.curve.reduce((best, point) =>
            Math.abs(point.lenM - lenM) < Math.abs(best.lenM - lenM) ? point : best,
          score.curve[0]);

      /** The score under the pointer, for the readout. */
      const hoverScore = hoverM === null ? null : scoreNear(hoverM);

      /**
       * A length and its verdict, as the slider speaks it: the modeled SWR
       * where there is one, the zone label where there is not.
       * @param {Meters} lenM
       * @returns {string}
       */
      const spokenAt = (lenM) => {
        const at = scoreNear(lenM);
        if (at !== null) return `${fmtLen(lenM, units)}, SWR ${at.swr.toFixed(1)}:1 typical`;
        const zone = zoneAt(lenM);
        return `${fmtLen(lenM, units)}, ${zone ? `avoid: ${zone.label}` : 'usable'}`;
      };

      /**
       * Arrow keys nudge the wire length by one rounding step in the display
       * unit (1 ft or 0.5 m), ten with Shift or PageUp/PageDown; Home and
       * End go to the ends of the axis.  Clamped to (0, maxLenM] so a step
       * cannot land on a zero-length wire.
       * @param {React.KeyboardEvent<SVGSVGElement>} event
       */
      const handleKeys = (event) => {
        const stepDisplay = UNITS[units].roundStep;
        const steps = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1,
                        ArrowDown: -1, PageUp: 10, PageDown: -10 };
        let next;
        if (event.key === 'Home') next = stepDisplay;
        else if (event.key === 'End') next = maxDisplay;
        else if (isKeyOf(steps, event.key)) {
          next = toDisplay(wireLenM, units)
            + steps[event.key] * (event.shiftKey ? 10 : 1) * stepDisplay;
        } else return;
        event.preventDefault();
        const nextM = fromDisplay(
          Math.min(maxDisplay, Math.max(stepDisplay, next)), units);
        onPick(nextM);
        setLiveText(spokenAt(nextM));
      };

      /** The measured point under the pointer, when one is close enough. */
      const hoverNec = (necPoints === null || necPoints.length === 0
                        || hoverM === null) ? null
        : necPoints.reduce((best, point) =>
            Math.abs(point.lenM - hoverM) < Math.abs(best.lenM - hoverM)
              ? point : best,
          necPoints[0]);
      const hoverNecNear = hoverNec !== null && hoverM !== null
        && Math.abs(hoverNec.lenM - hoverM)
           <= maxLenM / (NEC_LENGTH_SAMPLES - 1);

      return (
        <div className="map-container">
          <svg className="map-svg" viewBox={`0 0 ${MAP.width} ${svgHeight}`}
               role="slider" tabIndex={0} aria-label="Wire length map"
               aria-valuemin={0}
               aria-valuemax={Number(maxDisplay.toFixed(1))}
               aria-valuenow={Number(Math.min(toDisplay(wireLenM, units),
                                              maxDisplay).toFixed(1))}
               aria-valuetext={spokenAt(wireLenM)}
               onKeyDown={handleKeys}
               onMouseMove={handleMove} onMouseLeave={() => setHoverM(null)}
               onClick={(event) => onPick(lenAtEvent(event))}>
            <defs>
              {/* Diagonal hatch marks the too-short zone without relying on hue. */}
              <pattern id="hatch-short" width="8" height="8" patternUnits="userSpaceOnUse"
                       patternTransform="rotate(45)">
                <rect width="8" height="8" fill="#2a2a28" />
                <rect width="3" height="8" fill={COLORS.short} />
              </pattern>
            </defs>
            {/* Usable background */}
            {score === null && solution.usable.map((u, i) => (
              <rect key={`u${i}`} x={xOf(u.lo)} y={MAP.top}
                    width={Math.max(MIN_BAND_WIDTH, xOf(u.hi) - xOf(u.lo))}
                    height={plotHeight}
                    fill={COLORS.usable} stroke={COLORS.usableEdge} strokeWidth="0.5" />
            ))}
            {/* Lengths to avoid */}
            {score === null && solution.avoid.map((a, i) => (
              <rect key={`a${i}`} x={xOf(Math.max(0, a.lo))} y={MAP.top}
                    width={Math.max(MIN_BAND_WIDTH,
                                    xOf(Math.min(a.hi, maxLenM)) - xOf(Math.max(0, a.lo)))}
                    height={plotHeight}
                    fill={a.kind === 'short' ? 'url(#hatch-short)' : COLORS.avoid}
                    opacity={a.kind === 'short' ? 1 : 0.9} />
            ))}
            {/* Modeled SWR, with the too-short zone still marked */}
            {score !== null && (
              <g>
                <rect x={MAP.left} y={MAP.top}
                      width={Math.max(MIN_BAND_WIDTH, xOf(Math.min(score.shortLimit, maxLenM)) - MAP.left)}
                      height={plotHeight} fill="url(#hatch-short)" opacity="0.5" />
                {[2, 5, 10, 30].map(swr => (
                  <g key={swr}>
                    <line className="map-rule"
                          x1={MAP.left} y1={yOfSwr(swr)} x2={MAP.width - MAP.right}
                          y2={yOfSwr(swr)} stroke={COLORS.axis} strokeWidth="0.5"
                          strokeDasharray="3 3" />
                    <text x={MAP.left + 6} y={yOfSwr(swr) - 4} fill={COLORS.label}
                          fontSize={MAP.tickFontSize} textAnchor="start"
                          fontFamily="monospace">{swr}:1</text>
                  </g>
                ))}
                {necPath !== '' && (
                  <g className="nec-curve">
                    {necBand !== '' && (
                      <path className="nec-band" d={necBand} fill={COLORS.nec}
                            fillOpacity="0.22" stroke="none" />
                    )}
                    {necEdges.map((edge, i) => (
                      <path key={i} className="nec-edge" d={edge.d} fill="none"
                            stroke={COLORS.nec} strokeWidth="1.5"
                            strokeOpacity="0.85"
                            strokeDasharray={edge.dashed ? '5 4' : undefined} />
                    ))}
                    {necPath !== '' && (
                      <path className="nec-line" d={necPath} fill="none"
                            stroke={COLORS.nec} strokeWidth="4"
                            strokeOpacity="0.85" />
                    )}
                    <text x={MAP.width - MAP.right - 6} y={MAP.top + 12}
                          fill={COLORS.nec} fontSize={MAP.tickFontSize}
                          textAnchor="end" fontFamily="monospace">NEC-2</text>
                  </g>
                )}
                {/* Over the amber the model line needs a dark halo and a
                    little weight, or it vanishes inside the wider stroke. */}
                {necPath !== '' && (
                  <path d={curvePath} fill="none" stroke="#0a0a0a"
                        strokeWidth="5" strokeOpacity="0.75" />
                )}
                <path d={curvePath} fill="none" stroke={COLORS.usableEdge}
                      strokeWidth={necPath !== '' ? '2.25' : '1.5'} />
              </g>
            )}
            {/* Axis and ticks */}
            <line x1={MAP.left} y1={barBottom} x2={MAP.width - MAP.right} y2={barBottom}
                  stroke={COLORS.axis} strokeWidth="1" />
            {ticks.map((value) => {
              const x = xOf(fromDisplay(value, units));
              return (
                <g key={value}>
                  <line x1={x} y1={barBottom} x2={x} y2={barBottom + 5}
                        stroke={COLORS.axis} strokeWidth="1" />
                  <text x={x} y={barBottom + 24} fill={COLORS.label} fontSize={MAP.tickFontSize}
                        textAnchor="middle" fontFamily="monospace">{value}</text>
                </g>
              );
            })}
            <text x={MAP.width / 2} y={svgHeight - 4} fill={COLORS.label} fontSize={MAP.axisFontSize}
                  textAnchor="middle" fontFamily="monospace">
              wire length ({UNITS[units].axisLabel})
            </text>
            {/* Selected length marker */}
            {wireLenM > 0 && wireLenM <= maxLenM && (
              <line x1={xOf(wireLenM)} y1={MAP.top - 6} x2={xOf(wireLenM)} y2={barBottom + 3}
                    stroke={COLORS.marker} strokeWidth="2" />
            )}
            {hoverM !== null && (
              <line x1={xOf(hoverM)} y1={MAP.top} x2={xOf(hoverM)} y2={barBottom}
                    stroke="#fff" strokeWidth="1" opacity="0.5" />
            )}
          </svg>
          <div className="visually-hidden" aria-live="polite">{liveText}</div>
          <div className="map-readout">
            {hoverM === null
              ? 'Click the map, or focus it and use arrow keys, to set the wire length.'
              : score !== null && hoverScore
                ? `${fmtLen(hoverM, units)} - SWR ${hoverScore.swr.toFixed(1)}:1 typical, `
                  + `worst ${hoverScore.worst.swr.toFixed(1)}:1 on ${hoverScore.worst.band.label}`
                  + (hoverNecNear && hoverNec !== null
                    ? `, NEC-2 ${fmtSwr(hoverNec.best)}:1`
                      + (necShowsBand(hoverNec)
                        ? ` (${necSwrText(hoverNec.swr, hoverNec.alt)})` : '')
                    : '')
                : `${fmtLen(hoverM, units)} - ${hoverHit ? `avoid: ${hoverHit.label}` : 'usable'}`}
          </div>
          <div className="map-legend">
            {score === null ? (
              <>
                <span><span className="swatch" style={{ background: COLORS.avoid }}></span>
                  near a half-wave resonance</span>
                <span><span className="swatch swatch-hatch"></span>
                  shorter than λ/4</span>
                <span><span className="swatch" style={{ background: COLORS.usable,
                  boxShadow: `inset 0 0 0 1px ${COLORS.usableEdge}` }}></span>usable</span>
              </>
            ) : (
              <>
                <span><span className="swatch" style={{ background: COLORS.usableEdge }}></span>
                  modeled SWR at the radio, lower is better</span>
                <span><span className="swatch swatch-hatch"></span>
                  {score.shortLabel}</span>
              </>
            )}
            <span><span className="swatch" style={{ background: COLORS.marker }}></span>
              your wire</span>
            {necPoints !== null && necPoints.length > 0 && (
              <>
                <span><span className="swatch swatch-line swatch-bold"
                             style={{ borderColor: COLORS.nec }}></span>
                  {necAnyCred
                    ? 'NEC-2, the solver the page follows here'
                    : 'NEC-2 (nec2++; nec2c fails in this regime)'}</span>
                {necSplits.length > 0 && (
                  <>
                    <span><span className="swatch swatch-line"
                                 style={{ borderColor: COLORS.nec }}></span>
                      nec2c</span>
                    <span><span className="swatch swatch-line swatch-dashed"
                                 style={{ borderColor: COLORS.nec }}></span>
                      nec2++, where they part</span>
                  </>
                )}
              </>
            )}
          </div>
        </div>
      );
    }

    /**
     * Arrow keys within a group of role="radio" buttons.
     *
     * A screen reader announces "radio button, 1 of 5" and the user reaches
     * for the arrows, so the group has to answer them: the pattern is not
     * optional decoration on the role.  Reading the buttons out of the event
     * target rather than holding refs keeps this one handler for all eight
     * groups, and clicking the next one reuses whatever that option already
     * does rather than duplicating it here.
     *
     * @param {React.KeyboardEvent<HTMLElement>} event
     */
    const onRadioKeys = (event) => {
      const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
      const isEnd = event.key === 'Home' || event.key === 'End';
      const delta = isKeyOf(step, event.key) ? step[event.key] : 0;
      if (delta === 0 && !isEnd) return;
      const options = /** @type {HTMLElement[]} */ ([
        ...event.currentTarget.querySelectorAll('[role="radio"]:not([disabled])'),
      ]);
      if (options.length === 0) return;
      const from = options.findIndex(
        (option) => option === document.activeElement);
      const at = isEnd
        ? (event.key === 'Home' ? 0 : options.length - 1)
        // Wrapping, per the radio group pattern: the ends are not walls.
        : (from + delta + options.length) % options.length;
      event.preventDefault();
      options[at].focus();
      options[at].click();
    };

    /**

    /**

              How the modeled method works
            </div>
            <div className="changelog-text">
              <p>
                An end-fed wire is treated as two open-ended transmission
                lines in series, the antenna wire and the return path (drop
                plus counterpoise), each with a characteristic impedance from
                its length and gauge, a loss and a phase velocity. Their sum

              <p>
                The loss and velocity coefficients are fitted against NEC-4.2

                {MODEL_NEC_RUNS.toLocaleString('en-US')} NEC-4.2 simulations:
                every geometry solved at twice and four times the working
                segment density and extrapolated to the converged answer.
              </p>
              <p>
                The modeled impedance is within {MODEL_TYPICAL_FACTOR}x of NEC
                for half the lengths offered and {MODEL_BOUND_FACTOR}x for
                nine in ten; about one offered length in four at the defaults
                would not match through the tuner. Another{' '}
                {MODEL_HOLDOUT_RUNS.toLocaleString('en-US')} solves at
                geometries the fit never saw read the same to within a few
                percent. The first half-wave peak reads about twice high, so
                an end-fed half wave through a 49:1 is the case served worst,
                and no installation&apos;s ground, sag or common-mode current
                is predicted. The{' '}
                <a href={MODEL_NOTE_URL} target="_blank"
                   rel="noopener">modeling note</a> has every measurement.
